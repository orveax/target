name: TARGET How We Work Owner Review QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/how-we-work-owner-review-v1.css'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/how-we-work-owner-review-v1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  owner-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET How We Work Owner Review QA' --arg description 'Page 03 owner review QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/how-we-work-owner-review-v1.css
          grep -Fq 'how-we-work-owner-review-v1.css?v=20260818-01' src/layouts/BaseLayout.astro
          grep -Fq '9710824' public/assets/how-we-work-owner-review-v1.css
          grep -Fq 'grid-template-areas:' public/assets/how-we-work-owner-review-v1.css
          grep -Fq 'padding-top:clamp(72px,6.5vw,96px)!important' public/assets/how-we-work-owner-review-v1.css
          grep -Fq 'grid-template-columns:minmax(0,1fr) minmax(260px,.56fr)' public/assets/how-we-work-owner-review-v1.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Prepare Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/how-work-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/capabilities.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/how-work-http.log; exit 1
      - name: Browser QA
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p how-we-work-owner-review
          cat > how-we-work-owner-review/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const failures=[]; const metrics=[];
          for(const [name,width,height] of [['1440',1440,1000],['768',768,1024],['390',390,844]]){
            const ctx=await browser.newContext({viewport:{width,height},isMobile:width===390,hasTouch:width===390});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/capabilities.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{if(document.fonts)await document.fonts.ready});
            for(const lang of ['ar','en']){
              if(await page.locator('html').getAttribute('lang')!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(220)}
              const m=await page.evaluate(()=>{
                const way=document.querySelector('.work-way');
                const wayIcon=way?.querySelector('.work-icon')?.getBoundingClientRect();
                const wayTitle=way?.querySelector('h3')?.getBoundingClientRect();
                const audience=document.querySelector('.work-audiences article');
                const audIcon=audience?.querySelector('.work-icon')?.getBoundingClientRect();
                const audTitle=audience?.querySelector('h3')?.getBoundingClientRect();
                const hero=document.querySelector('.work-hero__route');
                const clarity=document.querySelector('.work-clarity');
                const finalBox=document.querySelector('.work-final > .container');
                const fs=finalBox?getComputedStyle(finalBox):null;
                return {
                  overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                  heroBg:getComputedStyle(hero).backgroundImage,
                  ways:document.querySelectorAll('.work-way').length,
                  audiences:document.querySelectorAll('.work-audiences article').length,
                  wayAlign:wayIcon&&wayTitle?Math.abs((wayIcon.top+wayIcon.height/2)-(wayTitle.top+wayTitle.height/2)):999,
                  audienceAlign:audIcon&&audTitle?Math.abs((audIcon.top+audIcon.height/2)-(audTitle.top+audTitle.height/2)):999,
                  clarityPadTop:parseFloat(getComputedStyle(clarity).paddingTop),
                  finalColumns:fs?.gridTemplateColumns||'',
                  finalDisplay:fs?.display||'',
                  finalActions:document.querySelectorAll('.work-final__actions a').length
                };
              });
              metrics.push({viewport:name,lang,...m});
              if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
              if(!m.heroBg.includes('9710824')) failures.push(`${name}-${lang}: new hero media is not active`);
              if(m.ways!==4) failures.push(`${name}-${lang}: expected 4 way cards`);
              if(m.audiences!==4) failures.push(`${name}-${lang}: expected 4 audience cards`);
              if(m.wayAlign>8) failures.push(`${name}-${lang}: way title is not aligned beside icon (${m.wayAlign.toFixed(1)}px)`);
              if(m.audienceAlign>8) failures.push(`${name}-${lang}: audience title is not aligned beside icon (${m.audienceAlign.toFixed(1)}px)`);
              if(m.clarityPadTop<56) failures.push(`${name}-${lang}: clarity section still lacks top spacing`);
              if(m.finalDisplay!=='grid') failures.push(`${name}-${lang}: final CTA is not arranged as grid`);
              if(m.finalActions!==2) failures.push(`${name}-${lang}: final CTA actions changed unexpectedly`);
              if(name==='1440' && m.finalColumns.split(' ').length<2) failures.push(`${name}-${lang}: final CTA desktop layout is not two-column`);
              if(name==='390' && m.finalColumns.split(' ').length>1) failures.push(`${name}-${lang}: final CTA mobile layout is not single-column`);
              await page.screenshot({path:`how-we-work-owner-review/${name}-${lang}.png`,fullPage:true});
            }
            await ctx.close();
          }
          fs.writeFileSync('how-we-work-owner-review/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('how-we-work-owner-review/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node how-we-work-owner-review/check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-how-we-work-owner-review
          path: how-we-work-owner-review
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Page 03 owner review QA passed'; else STATE=failure; DESC='Page 03 owner review QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET How We Work Owner Review QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
