name: TARGET Hard Audit Report Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hard-audit-report-once.yml'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install audit tooling
        run: npm install --no-save @astrojs/check typescript stylelint stylelint-config-recommended eslint @eslint/js typescript-eslint eslint-plugin-vue vue-eslint-parser eslint-plugin-astro globals knip

      - name: Run complete hard audit and write report
        shell: bash
        run: |
          set +e
          mkdir -p audit
          FAILURES=()

          run_check() {
            local key="$1"
            shift
            "$@" >/tmp/target-audit-${key}.log 2>&1
            local rc=$?
            if [[ $rc -eq 0 ]]; then
              eval "${key}=PASS"
            else
              eval "${key}=FAIL"
              FAILURES+=("$key")
            fi
          }

          run_check BUILD npm run build
          run_check TYPECHECK npx astro check

          JS_SYNTAX=PASS
          while IFS= read -r file; do
            node --check "$file" >/tmp/target-audit-js-one.log 2>&1
            if [[ $? -ne 0 ]]; then JS_SYNTAX=FAIL; FAILURES+=("JS_SYNTAX"); break; fi
          done < <(find public/assets scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort)

          cat >/tmp/stylelint-target.json <<'EOF'
          {"extends":["stylelint-config-recommended"],"rules":{"no-descending-specificity":null}}
          EOF
          run_check CSS_STRUCTURE npx stylelint 'public/assets/**/*.css' --config /tmp/stylelint-target.json

          cat >eslint.audit.config.mjs <<'EOF'
          import js from '@eslint/js';
          import globals from 'globals';
          import tseslint from 'typescript-eslint';
          import vue from 'eslint-plugin-vue';
          import vueParser from 'vue-eslint-parser';
          import astro from 'eslint-plugin-astro';
          export default [
            { ignores:['dist/**','node_modules/**'] },
            js.configs.recommended,
            ...tseslint.configs.recommended,
            ...vue.configs['flat/recommended'],
            ...astro.configs['flat/recommended'],
            { files:['src/**/*.vue'], languageOptions:{ parser:vueParser, globals:{...globals.browser}, parserOptions:{parser:tseslint.parser,sourceType:'module',extraFileExtensions:['.vue']} } },
            { files:['public/assets/**/*.js','scripts/**/*.mjs'], languageOptions:{globals:{...globals.browser,...globals.node}} },
            { files:['src/**/*.ts','src/**/*.vue','src/**/*.astro'], rules:{'@typescript-eslint/no-explicit-any':'error','vue/multi-word-component-names':'off'} }
          ];
          EOF
          run_check ESLINT npx eslint src public/assets scripts --config eslint.audit.config.mjs
          rm -f eslint.audit.config.mjs

          cat >knip.audit.json <<'EOF'
          {"entry":["src/pages/**/*.astro"],"project":["src/**/*.{astro,vue,ts}"]}
          EOF
          run_check UNUSED_CODE npx knip --config knip.audit.json --no-progress
          rm -f knip.audit.json

          run_check REPO_STRUCTURE node scripts/code-hard-audit.mjs
          run_check SECURITY npm audit --omit=dev --audit-level=high

          RUNTIME=SKIP
          ZERO_CSS='n/a'
          RUNTIME_FAILURES='n/a'
          SELECTOR_FILES='n/a'
          if [[ "$BUILD" == PASS ]]; then
            CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
            if [[ -n "$CHROME_PATH" ]]; then
              npx --yes http-server dist -p 4173 -c-1 >/tmp/target-audit-http.log 2>&1 &
              SERVER_PID=$!
              ready=0
              for i in {1..30}; do
                curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1 && { ready=1; break; }
                sleep 1
              done
              if [[ $ready -eq 1 ]]; then
                CHROME_PATH="$CHROME_PATH" TARGET_AUDIT_ORIGIN='http://127.0.0.1:4173' node scripts/runtime-coverage-audit.mjs >/tmp/target-audit-runtime.log 2>&1
                rc=$?
                if [[ $rc -eq 0 ]]; then RUNTIME=PASS; else RUNTIME=FAIL; FAILURES+=("RUNTIME"); fi
                if [[ -f runtime-coverage-report.json ]]; then
                  ZERO_CSS="$(node -e "const r=require('./runtime-coverage-report.json'); console.log(r.zeroCss.length)")"
                  RUNTIME_FAILURES="$(node -e "const r=require('./runtime-coverage-report.json'); console.log(r.failures.length)")"
                  SELECTOR_FILES="$(node -e "const r=require('./runtime-coverage-report.json'); console.log(r.selectors.filter(x=>x.unmatched.length).length)")"
                fi
              else
                RUNTIME=FAIL
                FAILURES+=("RUNTIME_SERVER")
              fi
              kill "$SERVER_PID" >/dev/null 2>&1 || true
            else
              RUNTIME=FAIL
              FAILURES+=("CHROME")
            fi
          fi

          if ((${#FAILURES[@]})); then OVERALL=FAIL; else OVERALL=PASS; fi
          FAIL_TEXT="$(IFS=', '; echo "${FAILURES[*]}")"
          [[ -n "$FAIL_TEXT" ]] || FAIL_TEXT='None'

          cat >audit/CODE_HARD_AUDIT_REPORT.md <<EOF
          # TARGET — Code Hard Audit Report

          - **Audited commit:** \`${GITHUB_SHA}\`
          - **Node:** 22
          - **Dependency install:** \`npm ci\` from committed lockfile
          - **Overall:** **${OVERALL}**
          - **Blocking stages:** ${FAIL_TEXT}

          | Audit gate | Result |
          |---|---:|
          | Astro production build | ${BUILD} |
          | Astro / TypeScript check | ${TYPECHECK} |
          | JavaScript syntax | ${JS_SYNTAX} |
          | CSS structural validation | ${CSS_STRUCTURE} |
          | ESLint source/runtime | ${ESLINT} |
          | Unused source/dependency scan | ${UNUSED_CODE} |
          | Repository structure/reference scan | ${REPO_STRUCTURE} |
          | Production dependency security audit | ${SECURITY} |
          | Runtime route/CSS/JS execution audit | ${RUNTIME} |

          ## Runtime summary

          - Zero-use first-party CSS assets: **${ZERO_CSS}**
          - Runtime/page execution failures: **${RUNTIME_FAILURES}**
          - Stylesheets containing at least one selector not reached by the audit matrix: **${SELECTOR_FILES}**

          ## Audit scope

          Static analysis covers current Astro/Vue/TypeScript source, all shipped JavaScript syntax, structural CSS errors, lint errors, unused source/dependencies, repository references and production dependency vulnerabilities. Runtime analysis covers the built static site across the public route inventory at desktop and mobile viewports with language switching and scrolling. No screenshot or image-quality test is used by this report.
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/CODE_HARD_AUDIT_REPORT.md
          git commit -m 'audit: publish code hard audit report [skip ci]' || true
          git push origin HEAD:main

          [[ "$OVERALL" == PASS ]]
