name: TARGET Final Content Hierarchy Tune Once

on:
  push:
    branches: [main]
    paths:
      - '.github/final-content-hierarchy-trigger.txt'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final visual/content tune
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # 1) Products & Companies — keep the background-number system, reduce visual dominance.
          replace_once(
              'public/assets/products-companies-canonical-guard.css',
              '''  color:#C09552!important;\n  -webkit-text-fill-color:#C09552!important;\n  opacity:1!important;''',
              '''  color:rgba(192,149,82,.12)!important;\n  -webkit-text-fill-color:rgba(192,149,82,.12)!important;\n  opacity:1!important;'''
          )

          # 2) Contact closing cards — shorter headings + supporting copy.
          replace_once(
              'src/pages/contact.astro',
              '''        <article><span class="ct-kicker" data-ar="لديك منتج؟" data-en="Have a Product?">لديك منتج؟</span><h2 data-ar="لديك منتج غذائي تريد مناقشة فرصته في قطر؟" data-en="Have a food product you want to discuss for Qatar?">لديك منتج غذائي تريد مناقشة فرصته في قطر؟</h2><a class="ct-support-primary" href="suppliers.html"><i data-lucide="send"></i><span data-ar="ناقش منتجك معنا" data-en="Discuss Your Product">ناقش منتجك معنا</span></a></article>\n        <article><span class="ct-kicker" data-ar="تحتاج إجابة سريعة؟" data-en="Need a Quick Answer?">تحتاج إجابة سريعة؟</span><h2 data-ar="راجع الأسئلة الشائعة حول المنتجات وطريقة العمل والتواصل." data-en="Review common questions about products, how we work and contact routes.">راجع الأسئلة الشائعة حول المنتجات وطريقة العمل والتواصل.</h2><a class="ct-support-secondary" href="faq.html"><i data-lucide="circle-help"></i><span data-ar="الأسئلة الشائعة" data-en="FAQ">الأسئلة الشائعة</span></a></article>''',
              '''        <article><span class="ct-kicker" data-ar="لديك منتج؟" data-en="Have a Product?">لديك منتج؟</span><h2 data-ar="ناقش فرصة منتجك في قطر." data-en="Discuss your product opportunity in Qatar.">ناقش فرصة منتجك في قطر.</h2><p class="ct-support-copy" data-ar="شارك بيانات المنتج الأساسية لنراجع الفئة والملاءمة ونحدد معك الخطوة التالية." data-en="Share the essential product details so we can review category fit and define the next step with you.">شارك بيانات المنتج الأساسية لنراجع الفئة والملاءمة ونحدد معك الخطوة التالية.</p><a class="ct-support-primary" href="suppliers.html"><i data-lucide="send"></i><span data-ar="ناقش منتجك معنا" data-en="Discuss Your Product">ناقش منتجك معنا</span></a></article>\n        <article><span class="ct-kicker" data-ar="تحتاج إجابة سريعة؟" data-en="Need a Quick Answer?">تحتاج إجابة سريعة؟</span><h2 data-ar="ابدأ من الأسئلة الشائعة." data-en="Start with the common questions.">ابدأ من الأسئلة الشائعة.</h2><p class="ct-support-copy" data-ar="إجابات مختصرة عن المنتجات، وطريقة العمل، وقنوات التواصل المناسبة." data-en="Quick answers about products, how we work and the right contact route.">إجابات مختصرة عن المنتجات، وطريقة العمل، وقنوات التواصل المناسبة.</p><a class="ct-support-secondary" href="faq.html"><i data-lucide="circle-help"></i><span data-ar="الأسئلة الشائعة" data-en="FAQ">الأسئلة الشائعة</span></a></article>'''
          )

          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '  grid-template-rows:auto 1fr auto!important;',
              '  grid-template-rows:auto auto 1fr auto!important;'
          )
          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '''.page-contact .ct-support-panel h2{\n  align-self:start!important;\n  margin:0!important;\n  text-wrap:balance!important;\n}\n.page-contact .ct-support-panel a{\n  align-self:end!important;\n  justify-self:start!important;\n  margin-top:28px!important;\n}''',
              '''.page-contact .ct-support-panel h2{\n  align-self:start!important;\n  margin:0!important;\n  text-wrap:balance!important;\n}\n.page-contact .ct-support-panel .ct-support-copy{\n  align-self:start!important;\n  max-width:48ch!important;\n  margin:13px 0 0!important;\n  font-size:.95rem!important;\n  line-height:1.72!important;\n}\n.page-contact .ct-support-panel a{\n  align-self:end!important;\n  justify-self:start!important;\n  margin-top:24px!important;\n}'''
          )
          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '''  max-width:17ch!important;\n  padding-inline-end:24px!important;\n  color:#fff!important;\n  font-size:clamp(1.9rem,2.85vw,2.58rem)!important;\n  line-height:1.17!important;''',
              '''  max-width:19ch!important;\n  padding-inline-end:24px!important;\n  color:#fff!important;\n  font-size:clamp(1.72rem,2.55vw,2.32rem)!important;\n  line-height:1.18!important;'''
          )
          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '''.page-contact .ct-support-primary{''',
              '''.page-contact .ct-support-panel article:first-child .ct-support-copy{\n  color:rgba(244,237,228,.74)!important;\n}\n.page-contact .ct-support-primary{'''
          )
          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '''  max-width:18ch!important;\n  padding-inline-end:12px!important;\n  color:var(--target-charcoal,#262626)!important;\n  font-size:clamp(1.55rem,2.18vw,2rem)!important;\n  line-height:1.24!important;''',
              '''  max-width:20ch!important;\n  padding-inline-end:12px!important;\n  color:var(--target-charcoal,#262626)!important;\n  font-size:clamp(1.45rem,2vw,1.82rem)!important;\n  line-height:1.24!important;'''
          )
          replace_once(
              'public/assets/contact-support-owner-review-v1.css',
              '''.page-contact .ct-support-secondary{''',
              '''.page-contact .ct-support-panel article+article .ct-support-copy{\n  color:rgba(38,38,38,.66)!important;\n}\n.page-contact .ct-support-secondary{'''
          )

          # 3) Company Profile closing CTA — concise heading + supporting commercial context.
          replace_once(
              'src/pages/company-profile.astro',
              '''        <div><span class="cp-kicker" data-ar="الخطوة التالية" data-en="Next Step">الخطوة التالية</span><h2 data-ar="لديك منتج غذائي تريد مناقشة فرصته في قطر؟" data-en="Have a food product you want to discuss for Qatar?">لديك منتج غذائي تريد مناقشة فرصته في قطر؟</h2></div>''',
              '''        <div class="cp-next-copy"><span class="cp-kicker" data-ar="الخطوة التالية" data-en="Next Step">الخطوة التالية</span><h2 data-ar="هل لديك منتج مناسب للسوق القطري؟" data-en="Have a product that could fit the Qatar market?">هل لديك منتج مناسب للسوق القطري؟</h2><p data-ar="إذا كنت مصنعًا أو موردًا، شارك بيانات المنتج لنراجع الفئة والملاءمة ونحدد المسار المناسب للخطوة التالية." data-en="If you are a manufacturer or supplier, share the product details so we can review category fit and define the appropriate next route.">إذا كنت مصنعًا أو موردًا، شارك بيانات المنتج لنراجع الفئة والملاءمة ونحدد المسار المناسب للخطوة التالية.</p></div>'''
          )

          replace_once(
              'public/assets/cross-page-final-overrides-v1.css',
              '''.page-company-profile .cp-next-panel{\n  background:var(--target-charcoal,#262626)!important;\n  box-shadow:0 20px 48px rgba(38,38,38,.16)!important;\n}\n.page-company-profile .cp-next-panel h2{color:#fff!important}\n.page-company-profile .cp-next-panel .cp-kicker{color:var(--target-sand,#C09552)!important}''',
              '''.page-company-profile .cp-next-panel{\n  grid-template-columns:minmax(0,1.15fr) auto!important;\n  gap:44px!important;\n  padding:42px 44px!important;\n  background:var(--target-charcoal,#262626)!important;\n  box-shadow:0 20px 48px rgba(38,38,38,.16)!important;\n}\n.page-company-profile .cp-next-copy{\n  position:relative;\n  z-index:2;\n  max-width:650px;\n}\n.page-company-profile .cp-next-panel h2{\n  max-width:16ch!important;\n  margin:10px 0 12px!important;\n  color:#fff!important;\n  font-size:clamp(1.85rem,2.6vw,2.5rem)!important;\n  line-height:1.16!important;\n}\n.page-company-profile .cp-next-copy p{\n  max-width:58ch;\n  margin:0;\n  color:rgba(244,237,228,.72)!important;\n  font-size:.96rem;\n  line-height:1.72;\n}\n.page-company-profile .cp-next-panel .cp-kicker{color:var(--target-sand,#C09552)!important}'''
          )

          # Responsive stack remains owned by canonical CSS; only normalize copy width on stacked layouts.
          p = Path('public/assets/cross-page-final-overrides-v1.css')
          text = p.read_text()
          marker = '''@media(max-width:991.98px){\n  .page-capabilities .work-canonical .work-info-media{'''
          insert = '''@media(max-width:991.98px){\n  .page-company-profile .cp-next-panel{\n    grid-template-columns:1fr!important;\n    gap:24px!important;\n  }\n  .page-company-profile .cp-next-copy{max-width:none}\n  .page-capabilities .work-canonical .work-info-media{'''
          if marker not in text:
              raise SystemExit('cross-page-final-overrides-v1.css: responsive marker not found')
          p.write_text(text.replace(marker, insert, 1))
          PY

          git rm .github/workflows/final-content-hierarchy-tune-once.yml .github/final-content-hierarchy-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/products-companies-canonical-guard.css src/pages/contact.astro public/assets/contact-support-owner-review-v1.css src/pages/company-profile.astro public/assets/cross-page-final-overrides-v1.css
          git commit -m 'polish: final numbered cards and CTA content hierarchy'
          git push origin HEAD:main
