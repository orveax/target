name: TARGET Hard Audit Temporary Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'audit/CODE_HARD_AUDIT_REPORT.md'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary hard-audit runner files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/hard-audit-report-once.yml \
            .github/workflows/hard-audit-report-once-v2.yml \
            .github/workflows/hard-audit-temp-cleanup.yml \
            audit/hard-audit-report.trigger
          git commit -m 'audit: remove temporary hard-audit runners [skip ci]'
          git push origin HEAD:main
