name: TARGET Code Hard Audit V1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  code-hard-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Code Hard Audit V1' --arg description 'Code hard audit is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked project dependencies
        run: npm ci

      - name: Build compiler gate
        id: build
        continue-on-error: true
        run: npm run build

      - name: Install static-analysis tools
        run: npm install --no-save @astrojs/check typescript stylelint stylelint-config-recommended eslint @eslint/js typescript-eslint eslint-plugin-vue vue-eslint-parser eslint-plugin-astro globals knip

      - name: Astro and TypeScript check
        id: astro
        continue-on-error: true
        run: npx astro check

      - name: JavaScript syntax check
        id: javascript
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find public/assets scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) | sort)

      - name: CSS structural check
        id: css
        continue-on-error: true
        shell: bash
        run: |
          cat > /tmp/stylelint-target.json <<'EOF'
          {
            "extends": ["stylelint-config-recommended"],
            "rules": {
              "no-descending-specificity": null
            }
          }
          EOF
          npx stylelint 'public/assets/**/*.css' --config /tmp/stylelint-target.json

      - name: ESLint source and runtime check
        id: eslint
        continue-on-error: true
        shell: bash
        run: |
          cat > eslint.audit.config.mjs <<'EOF'
          import js from '@eslint/js';
          import globals from 'globals';
          import tseslint from 'typescript-eslint';
          import vue from 'eslint-plugin-vue';
          import vueParser from 'vue-eslint-parser';
          import astro from 'eslint-plugin-astro';

          export default [
            { ignores: ['dist/**', 'node_modules/**'] },
            js.configs.recommended,
            ...tseslint.configs.recommended,
            ...vue.configs['flat/recommended'],
            ...astro.configs['flat/recommended'],
            {
              files: ['src/**/*.vue'],
              languageOptions: {
                parser: vueParser,
                globals: { ...globals.browser },
                parserOptions: {
                  parser: tseslint.parser,
                  sourceType: 'module',
                  extraFileExtensions: ['.vue']
                }
              }
            },
            {
              files: ['public/assets/**/*.js', 'scripts/**/*.mjs'],
              languageOptions: { globals: { ...globals.browser, ...globals.node } }
            },
            {
              files: ['src/**/*.ts', 'src/**/*.vue', 'src/**/*.astro'],
              rules: {
                '@typescript-eslint/no-explicit-any': 'error',
                'vue/multi-word-component-names': 'off'
              }
            }
          ];
          EOF
          status=0
          npx eslint src public/assets scripts --config eslint.audit.config.mjs || status=$?
          rm -f eslint.audit.config.mjs
          exit "$status"

      - name: Unused source and dependency check
        id: knip
        continue-on-error: true
        shell: bash
        run: |
          cat > knip.audit.json <<'EOF'
          {
            "entry": ["src/pages/**/*.astro"],
            "project": ["src/**/*.{astro,vue,ts}"]
          }
          EOF
          status=0
          npx knip --config knip.audit.json --no-progress || status=$?
          rm -f knip.audit.json
          exit "$status"

      - name: Repository structure and reference scan
        id: structure
        continue-on-error: true
        run: node scripts/code-hard-audit.mjs

      - name: Start local release server
        id: server
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          npx --yes http-server dist -p 4173 -c-1 >/tmp/target-hard-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-hard-audit-http.log
          exit 1

      - name: CSS and JavaScript runtime coverage inventory
        id: coverage
        if: steps.build.outcome == 'success' && steps.server.outcome == 'success'
        continue-on-error: true
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
          TARGET_AUDIT_ORIGIN: http://127.0.0.1:4173
        run: node scripts/runtime-coverage-audit.mjs

      - name: Production dependency audit
        id: security
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Aggregate hard-audit result
        if: always()
        shell: bash
        run: |
          failures=()
          [[ '${{ steps.build.outcome }}' == 'success' ]] || failures+=('build')
          [[ '${{ steps.astro.outcome }}' == 'success' ]] || failures+=('astro/typecheck')
          [[ '${{ steps.javascript.outcome }}' == 'success' ]] || failures+=('javascript syntax')
          [[ '${{ steps.css.outcome }}' == 'success' ]] || failures+=('css structure')
          [[ '${{ steps.eslint.outcome }}' == 'success' ]] || failures+=('eslint')
          [[ '${{ steps.knip.outcome }}' == 'success' ]] || failures+=('unused source/dependencies')
          [[ '${{ steps.structure.outcome }}' == 'success' ]] || failures+=('repository structure')
          if [[ '${{ steps.build.outcome }}' == 'success' ]]; then
            [[ '${{ steps.server.outcome }}' == 'success' ]] || failures+=('release server')
            [[ '${{ steps.coverage.outcome }}' == 'success' ]] || failures+=('runtime coverage execution')
          fi
          [[ '${{ steps.security.outcome }}' == 'success' ]] || failures+=('production security audit')
          if ((${#failures[@]})); then
            printf 'Blocking hard-audit stages:\n'
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi
          echo 'TARGET CODE HARD AUDIT: PASS'

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Code hard audit passed'; else STATE=failure; DESC='Code hard audit found blocking issues'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET Code Hard Audit V1' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
