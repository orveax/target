name: TARGET About Premium V2 QA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  about-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify About Premium V2 architecture and canonical contract
        run: |
          set -euo pipefail
          PAGE='src/components/AboutCanonical.astro'
          CSS='public/assets/about-canonical.css'
          LAYOUT='src/layouts/BaseLayout.astro'
          MEDIA='public/content/about-media-v2.json'

          test -f "$PAGE"
          test -f "$CSS"
          test -f "$MEDIA"

          # One authoritative About page layer.
          grep -q 'about-canonical.css?v=20260817-02' "$LAYOUT"
          test "$(grep -o 'about-canonical.css?v=20260817-02' "$LAYOUT" | wc -l)" -eq 1
          ! grep -q 'about-visual-polish.css' "$LAYOUT"
          ! grep -q 'about-real-photography-v2.css' "$LAYOUT"
          ! grep -q 'about-final-refinement-v1.css' "$LAYOUT"
          ! grep -q 'hero-about-premium-v1.css' "$LAYOUT"
          test ! -e public/assets/about-visual-polish.css
          test ! -e public/assets/about-real-photography-v2.css
          test ! -e public/assets/about-final-refinement-v1.css
          test ! -e public/assets/hero-about-premium-v1.css

          # Canonical content and six-section architecture preserved.
          grep -q 'شركة قطرية لتجارة واستيراد الأغذية تربط المنتجات المناسبة بفرص السوق القطري.' "$PAGE"
          grep -q 'تجارة أغذية مرتبطة بالمنتج والفرصة والسوق.' "$PAGE"
          grep -q 'رؤيتنا ورسالتنا' "$PAGE"
          grep -q 'حلقة تجارية محلية بين المنتج والسوق القطري.' "$PAGE"
          grep -q 'تعامل واضح يحمي الطرفين' "$PAGE"
          grep -q 'تحتاج نظرة رسمية ومختصرة عن تارقت؟' "$PAGE"
          grep -q 'لديك منتج غذائي وتريد مناقشة فرصته في قطر؟' "$PAGE"
          grep -q 'href="company-profile.html"' "$PAGE"
          grep -q 'href="suppliers.html"' "$PAGE"

          # Institutional Editorial identity and responsive behavior.
          grep -q 'Institutional Editorial' "$CSS"
          grep -q '02 / ABOUT TARGET' "$CSS"
          grep -q 'grid-template-columns:minmax(0,1.06fr) minmax(390px,.94fr)' "$CSS"
          grep -q 'border-radius:26px 26px 78px 26px' "$CSS"
          grep -q 'about-flow-node--target' "$CSS"
          grep -q '@media (max-width:767.98px)' "$CSS"
          grep -q 'handheld-desktop-mode .page-about' "$CSS"
          grep -q 'dir="ltr"' "$CSS"
          grep -q 'prefers-reduced-motion:reduce' "$CSS"

          # Real photography + rights/source records.
          grep -q '4481260' "$CSS"
          grep -q '9710824' "$CSS"
          grep -q '"sourceId": "4481260"' "$MEDIA"
          grep -q '"sourceId": "9710824"' "$MEDIA"
          grep -q 'rightsNote' "$MEDIA"

          # Built page carries only the new About page layer.
          grep -q 'about-canonical.css?v=20260817-02' dist/about.html
          ! grep -q 'about-visual-polish.css' dist/about.html
          ! grep -q 'about-real-photography-v2.css' dist/about.html
          ! grep -q 'about-final-refinement-v1.css' dist/about.html
          ! grep -q 'hero-about-premium-v1.css' dist/about.html

          echo 'TARGET ABOUT PREMIUM V2 SOURCE CONTRACT: PASS'
      - name: Run site-wide regression audit
        run: node scripts/final-audit.mjs
