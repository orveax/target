name: TARGET Home Premium V2+ QA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  home-v2-plus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify Home V2+ architecture and visual contract
        run: |
          set -euo pipefail
          HOME='src/components/HomePremium.astro'
          CSS='public/assets/home-canonical.css'
          LAYOUT='src/layouts/BaseLayout.astro'
          MANIFEST='public/content/hero-media-manifest-v1.json'

          test -f "$HOME"
          test -f "$CSS"
          test -f "$LAYOUT"
          test -f "$MANIFEST"

          # One authoritative Home stylesheet; legacy layers must not return.
          grep -q 'home-canonical.css?v=20260817-02' "$LAYOUT"
          test "$(grep -o 'home-canonical.css?v=20260817-02' "$LAYOUT" | wc -l)" -eq 1
          ! grep -q 'home-visual-polish.css' "$LAYOUT"
          ! grep -q 'home-real-photography-v2.css' "$LAYOUT"
          ! grep -q 'hero-home-premium-v2.css' "$LAYOUT"
          ! grep -q 'premium-hero-system-v1.css' "$LAYOUT"
          test ! -e public/assets/home-visual-polish.css
          test ! -e public/assets/home-real-photography-v2.css
          test ! -e public/assets/hero-home-premium-v2.css
          test ! -e public/assets/premium-hero-system-v1.css

          # Canonical copy and routes preserved.
          grep -q 'data-ar="من المصنع إلى السوق القطري."' "$HOME"
          grep -q 'href="suppliers.html"' "$HOME"
          grep -q 'href="capabilities.html"' "$HOME"
          grep -q 'class="hc-route"' "$HOME"
          grep -q 'class="hc-media-tag"' "$HOME"

          # Hero V2+ identity and geometry.
          grep -q 'HOME HERO — PREMIUM V2+' "$CSS"
          grep -q 'linear-gradient(145deg,var(--hc-forest)' "$CSS"
          grep -q 'grid-template-columns:minmax(0,.90fr) minmax(500px,1.10fr)' "$CSS"
          grep -q 'font-size:clamp(3.25rem,5.75vw,5.45rem)' "$CSS"
          grep -q 'border-radius:32px 32px 92px 32px' "$CSS"
          grep -q '.hc-route:hover' "$CSS"
          grep -q 'translateY(-4px)' "$CSS"

          # Real imagery mapped to content, not generic decoration.
          grep -q 'photos/11679685/' "$CSS"
          grep -q 'photos/5953751/' "$CSS"
          grep -q 'photos/11678431/' "$CSS"
          grep -q 'photos/8329985/' "$HOME"
          grep -q '11679685' "$MANIFEST"
          grep -q '5953751' "$MANIFEST"
          grep -q '8329985' "$MANIFEST"
          grep -q '11678431' "$MANIFEST"

          # Responsive, RTL/LTR, accessibility and Desktop Site contract.
          grep -q '@media (max-width:767.98px)' "$CSS"
          grep -q 'handheld-desktop-mode .page-home' "$CSS"
          grep -q "html\[dir='ltr'\]" "$CSS"
          grep -q "html\[lang='en'\]" "$CSS"
          grep -q 'focus-visible' "$CSS"
          grep -q 'prefers-reduced-motion:reduce' "$CSS"

          # Built Home must carry the new single layer.
          grep -q 'home-canonical.css?v=20260817-02' dist/index.html
          ! grep -q 'home-visual-polish.css' dist/index.html
          ! grep -q 'home-real-photography-v2.css' dist/index.html
          ! grep -q 'premium-hero-system-v1.css' dist/index.html

          echo 'TARGET HOME PREMIUM V2+ SOURCE CONTRACT: PASS'
      - name: Run site-wide regression audit
        run: node scripts/final-audit.mjs
