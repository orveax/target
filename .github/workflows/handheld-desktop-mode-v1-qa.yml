name: TARGET Handheld Desktop Mode V1 QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  handheld-desktop-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify handheld desktop-mode contract
        run: |
          test -f dist/assets/handheld-desktop-mode-v1.js
          test -f dist/assets/handheld-desktop-mode-v1.css
          grep -q 'handheld-desktop-mode-v1.js?v=20260817-01' dist/index.html
          grep -q 'handheld-desktop-mode-v1.css?v=20260817-01' dist/index.html
          grep -q "shortSide<=620" dist/assets/handheld-desktop-mode-v1.js
          grep -q "window.innerWidth>=760" dist/assets/handheld-desktop-mode-v1.js
          grep -q "window.innerWidth<=1180" dist/assets/handheld-desktop-mode-v1.js
          grep -q "handheld-desktop-mode" dist/assets/handheld-desktop-mode-v1.js
          grep -q "hc-hero-grid" dist/assets/handheld-desktop-mode-v1.css
          grep -q "hc-category-grid" dist/assets/handheld-desktop-mode-v1.css
          grep -q "grid-template-columns:repeat(4,minmax(0,1fr))" dist/assets/handheld-desktop-mode-v1.css
          grep -q "target-footer-v5 .tf5-main" dist/assets/handheld-desktop-mode-v1.css
          grep -q "target-footer-v5 .tf5-contact" dist/assets/handheld-desktop-mode-v1.css
          grep -q "grid-template-columns:minmax(250px,.82fr) minmax(0,1.18fr)" dist/assets/handheld-desktop-mode-v1.css
          grep -q "footer-premium-v5.css?v=20260817-01.*handheld-desktop-mode-v1.css?v=20260817-01" dist/index.html
