name: TARGET Home Owner Review Delta QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/owner-review-delta-v1.css'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/home-owner-review-delta-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  owner-review-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Home Owner Review QA' --arg description 'Homepage owner-review QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify owner review source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/owner-review-delta-v1.css
          grep -Fq 'owner-review-delta-v1.css?v=20260818-04' src/layouts/BaseLayout.astro
          grep -Fq 'photos/11679687/' public/assets/owner-review-delta-v1.css
          grep -Fq 'grid-template-columns:42px minmax(0,1fr)' public/assets/owner-review-delta-v1.css
          grep -Fq '.hc-steps li>div' public/assets/owner-review-delta-v1.css
          grep -Fq '.hc-steps h3' public/assets/owner-review-delta-v1.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Prepare hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/home-owner-review-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/home-owner-review-http.log; exit 1
      - name: Browser and visual alignment QA
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p home-owner-review
          cat > home-owner-review/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/index.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000}}],
            ['390',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const ctx=await browser.newContext(opts);
            const page=await ctx.newPage();
            try{
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              await page.waitForTimeout(250);
              for(const lang of ['ar','en']){
                if(await page.locator('html').getAttribute('lang')!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(220);}
                const m=await page.evaluate(()=>{
                  const work=document.querySelector('.hc-work-grid');
                  const pseudo=getComputedStyle(work,'::before');
                  const cards=[...document.querySelectorAll('.hc-steps li')].map(li=>{
                    const n=li.querySelector('.hc-step-number').getBoundingClientRect();
                    const i=li.querySelector('.hc-step-icon').getBoundingClientRect();
                    const h=li.querySelector('h3').getBoundingClientRect();
                    const p=li.querySelector('p').getBoundingClientRect();
                    const d=getComputedStyle(li);
                    const inner=getComputedStyle(li.querySelector(':scope > div'));
                    return {
                      numberTop:n.top,iconTop:i.top,titleTop:h.top,titleBottom:h.bottom,copyTop:p.top,
                      display:d.display,columns:d.gridTemplateColumns,innerDisplay:inner.display,
                      innerColumns:inner.gridTemplateColumns
                    };
                  });
                  return {
                    lang:document.documentElement.lang,
                    dir:document.documentElement.dir,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    image:pseudo.backgroundImage,
                    cards
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(!m.image.includes('11679687')) failures.push(`${name}-${lang}: How We Work image override is not active`);
                if(m.cards.length!==4) failures.push(`${name}-${lang}: expected 4 start cards`);
                for(const [idx,c] of m.cards.entries()){
                  if(c.display!=='grid'||c.innerDisplay!=='grid') failures.push(`${name}-${lang}: card ${idx+1} grid alignment not active`);
                  if(Math.abs(c.numberTop-c.iconTop)>10) failures.push(`${name}-${lang}: card ${idx+1} number/icon top alignment drift`);
                  if(c.titleTop<c.iconTop-4||c.titleTop>c.iconTop+16) failures.push(`${name}-${lang}: card ${idx+1} title is not aligned with header row`);
                  if(c.copyTop<c.titleBottom+5) failures.push(`${name}-${lang}: card ${idx+1} copy collides with title`);
                }
                await page.locator('.hc-work').screenshot({path:`home-owner-review/${name}-${lang}-how-we-work.png`});
                await page.locator('.hc-start').screenshot({path:`home-owner-review/${name}-${lang}-how-to-start.png`});
              }
            }catch(e){failures.push(`${name}: ${e.message}`)}finally{await ctx.close()}
          }
          fs.writeFileSync('home-owner-review/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('home-owner-review/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node home-owner-review/capture.mjs
      - name: Upload owner review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-home-owner-review-delta
          path: home-owner-review
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Homepage owner-review QA passed'; else STATE=failure; DESC='Homepage owner-review QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET Home Owner Review QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
