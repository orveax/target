name: TARGET Company Profile Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/company-profile-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/company-profile.astro'
      - '.github/workflows/company-profile-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  company-profile-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Company Profile resource contract
        run: |
          test -f public/assets/company-profile-polish-v2.css
          grep -q 'company-profile-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -q 'Resource governance corrected' public/assets/company-profile-polish-v2.css
          grep -q 'grid-template-columns:repeat(2' public/assets/company-profile-polish-v2.css
          grep -q 'cp-pending-box' src/pages/company-profile.astro
          grep -q 'Final PDF asset pending' src/pages/company-profile.astro
          grep -q 'No download link will be shown before the file is approved' src/pages/company-profile.astro
          ! grep -q 'INTERNAL PREVIEW' src/pages/company-profile.astro
          ! grep -q 'documentMeta' src/pages/company-profile.astro
          ! grep -q 'target-company-profile.pdf' src/pages/company-profile.astro
          grep -q 'suppliers.html' src/pages/company-profile.astro
          grep -q 'contact.html' src/pages/company-profile.astro
          grep -q 'prefers-reduced-motion:reduce' public/assets/company-profile-polish-v2.css
      - name: Build Astro site
        run: |
          npm install
          npm run build
