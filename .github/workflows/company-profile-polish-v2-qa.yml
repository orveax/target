name: TARGET Company Profile Premium V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/company-profile-canonical.css'
      - 'public/assets/header-profile-resource-v1.css'
      - 'src/data/companyProfile.ts'
      - 'src/components/SiteHeader.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/company-profile.astro'
      - '.github/workflows/company-profile-polish-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  company-profile-premium-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Company Profile Premium V2 QA' --arg description 'Company Profile Premium V2 QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical document and navigation hierarchy
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/company-profile-canonical.css
          test -f public/assets/header-profile-resource-v1.css
          test -f src/data/companyProfile.ts
          grep -Fq 'company-profile-canonical.css?v=20260818-03' src/layouts/BaseLayout.astro
          grep -Fq 'header-profile-resource-v1.css?v=20260818-01' src/layouts/BaseLayout.astro
          grep -Fq 'grid-template-columns:minmax(0,55fr) minmax(340px,45fr)' public/assets/company-profile-canonical.css
          grep -Fq '.cp-hero-pattern' public/assets/company-profile-canonical.css
          grep -Fq 'repeating-linear-gradient' public/assets/company-profile-canonical.css
          grep -Fq "downloadUrl: 'https://drive.google.com/uc?export=download&id=1sLGRCC5re16gRsXZVpXm5oSzxA5TRjqm'" src/data/companyProfile.ts
          grep -Fq "viewUrl: 'https://drive.google.com/file/d/1sLGRCC5re16gRsXZVpXm5oSzxA5TRjqm/view'" src/data/companyProfile.ts
          grep -Fq "pages: '10'" src/data/companyProfile.ts
          grep -Fq "size: '20.66 MB'" src/data/companyProfile.ts
          grep -Fq "version: 'Rev2 · 17 Aug 2026'" src/data/companyProfile.ts
          grep -Fq 'data-profile-download-state="active"' src/pages/company-profile.astro
          grep -Fq 'data-profile-download' src/pages/company-profile.astro
          grep -Fq 'data-profile-view' src/pages/company-profile.astro
          grep -Fq 'cp-hero-pattern' src/pages/company-profile.astro
          grep -Fq 'تحميل الملف التعريفي' src/pages/company-profile.astro
          grep -Fq 'Download Company Profile' src/pages/company-profile.astro
          ! grep -Fq 'data-profile-header-download' src/components/SiteHeader.astro
          grep -Fq 'th2-mega-profile-card' src/components/SiteHeader.astro
          grep -Fq 'data-profile-mega-download' src/components/SiteHeader.astro
          grep -Fq 'th2-mobile-profile-card' src/components/SiteHeader.astro
          grep -Fq 'data-profile-mobile-download' src/components/SiteHeader.astro
          grep -Fq 'th2-mobile-secondary--compact' src/components/SiteHeader.astro
          grep -Fq 'products-companies.html' src/pages/company-profile.astro
          ! grep -Fq 'food-portfolio.html' src/pages/company-profile.astro
          ! grep -Fq 'PDF PENDING' src/pages/company-profile.astro
          ! grep -Fq 'withheld-access-control' src/pages/company-profile.astro
          grep -Fq 'prefers-reduced-motion:reduce' public/assets/company-profile-canonical.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Install Playwright package and use hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-company-profile-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/company-profile.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-company-profile-http.log
          exit 1
      - name: Capture and validate AR/EN hierarchy contract
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p company-profile-premium-v2
          cat > company-profile-premium-v2/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/company-profile.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              for(const lang of ['ar','en']){
                const current=await page.locator('html').getAttribute('lang');
                if(current!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(250);}
                await page.screenshot({path:`company-profile-premium-v2/${name}-${lang}-first-fold.png`,fullPage:false});
                const m=await page.evaluate(()=>{
                  const hero=document.querySelector('.cp-hero');
                  const grid=document.querySelector('.cp-hero-grid');
                  const copy=document.querySelector('.cp-hero-copy');
                  const media=document.querySelector('.cp-profile-preview-hero');
                  const pattern=document.querySelector('.cp-hero-pattern');
                  const cr=copy.getBoundingClientRect(), mr=media.getBoundingClientRect();
                  const previewImgs=[...document.querySelectorAll('.cp-profile-preview img')];
                  const routes=[...document.querySelectorAll('.cp-route')].map(a=>a.getAttribute('href'));
                  const downloads=[...document.querySelectorAll('[data-profile-download]')];
                  const views=[...document.querySelectorAll('[data-profile-view]')];
                  return {
                    lang:document.documentElement.lang,
                    width:innerWidth,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1Count:document.querySelectorAll('.page-company-profile h1').length,
                    sections:['.cp-hero','.cp-snapshot','.cp-explore','.cp-resource','.cp-document-info','.cp-next'].filter(s=>document.querySelector(s)).length,
                    facts:document.querySelectorAll('.cp-fact').length,
                    routes:routes.length,
                    routeHrefs:routes,
                    metadata:document.querySelectorAll('.cp-meta-item').length,
                    downloadState:hero.dataset.profileDownloadState,
                    heroActions:document.querySelectorAll('.cp-hero-actions .cp-btn').length,
                    resourceActions:document.querySelectorAll('.cp-resource-actions .cp-btn').length,
                    downloadCount:downloads.length,
                    viewCount:views.length,
                    downloadHrefs:downloads.map(a=>a.getAttribute('href')),
                    desktopHeaderDownload:!!document.querySelector('[data-profile-header-download]'),
                    megaCard:!!document.querySelector('.th2-mega-profile-card'),
                    megaDownload:!!document.querySelector('[data-profile-mega-download]'),
                    mobileCard:!!document.querySelector('.th2-mobile-profile-card'),
                    mobileDownload:!!document.querySelector('[data-profile-mobile-download]'),
                    mobileSecondaryLinks:document.querySelectorAll('.th2-mobile-secondary--compact>a').length,
                    patternBg:getComputedStyle(pattern).backgroundImage,
                    patternOpacity:getComputedStyle(pattern).opacity,
                    previewCount:previewImgs.length,
                    previewLoaded:previewImgs.every(img=>img.complete&&img.naturalWidth>100&&img.naturalHeight>50),
                    copyTop:cr.top,mediaTop:mr.top,copyWidth:cr.width,mediaWidth:mr.width
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1Count!==1) failures.push(`${name}-${lang}: expected one H1`);
                if(m.sections!==6) failures.push(`${name}-${lang}: expected six canonical page sections, found ${m.sections}`);
                if(m.facts!==4) failures.push(`${name}-${lang}: expected four snapshot facts`);
                if(m.routes!==4) failures.push(`${name}-${lang}: expected four explore routes`);
                if(!m.routeHrefs.includes('products-companies.html')) failures.push(`${name}-${lang}: Products & Companies route is stale`);
                if(m.metadata!==4) failures.push(`${name}-${lang}: expected four verified metadata items`);
                if(m.downloadState!=='active') failures.push(`${name}-${lang}: download state is not active`);
                if(m.heroActions!==3) failures.push(`${name}-${lang}: expected Download/View/About hero hierarchy`);
                if(m.resourceActions!==2) failures.push(`${name}-${lang}: expected Download/View resource actions`);
                if(m.downloadCount!==2||m.viewCount!==2) failures.push(`${name}-${lang}: page download/view controls incomplete`);
                if(!m.downloadHrefs.every(h=>h&&h.includes('drive.google.com/uc?export=download&id=1sLGRCC5re16gRsXZVpXm5oSzxA5TRjqm'))) failures.push(`${name}-${lang}: download href is not the verified profile asset`);
                if(m.desktopHeaderDownload) failures.push(`${name}-${lang}: desktop header must not contain Company Profile download button`);
                if(!m.megaCard||!m.megaDownload) failures.push(`${name}-${lang}: refined mega-menu Company Profile resource is missing`);
                if(!m.mobileCard||!m.mobileDownload||m.mobileSecondaryLinks!==2) failures.push(`${name}-${lang}: refined mobile Company Profile resource hierarchy is incomplete`);
                if(!m.patternBg||m.patternBg==='none'||Number(m.patternOpacity)<=0) failures.push(`${name}-${lang}: hero pattern is not rendered`);
                if(m.previewCount!==2||!m.previewLoaded) failures.push(`${name}-${lang}: verified final-file preview failed to load`);
                if(name==='1440'){
                  const ratio=m.copyWidth/m.mediaWidth;
                  if(ratio<1.05||ratio>1.50) failures.push(`${name}-${lang}: desktop hero ratio ${ratio.toFixed(2)} outside 55/45 tolerance`);
                }else if(!(m.copyTop<m.mediaTop)) failures.push(`${name}-${lang}: text/actions must precede document preview on tablet/mobile`);
                if(name==='1440'){
                  await page.locator('[data-th2-mega-toggle]').click();
                  await page.waitForTimeout(180);
                  const cardVisible=await page.locator('.th2-mega-profile-card').isVisible();
                  if(!cardVisible) failures.push(`${name}-${lang}: mega-menu profile resource card is not visible when menu opens`);
                  await page.screenshot({path:`company-profile-premium-v2/${name}-${lang}-mega.png`,fullPage:false});
                  await page.keyboard.press('Escape');
                }
                if(name==='390'){
                  await page.locator('.th2-menu-button').click();
                  await page.waitForTimeout(240);
                  const card=page.locator('.th2-mobile-profile-card');
                  await card.scrollIntoViewIfNeeded();
                  if(!(await card.isVisible())) failures.push(`${name}-${lang}: mobile profile resource card is not visible`);
                  if(await card.locator('a').count()!==2) failures.push(`${name}-${lang}: mobile profile card must expose exactly View and Download actions`);
                  await page.screenshot({path:`company-profile-premium-v2/${name}-${lang}-mobile-menu.png`,fullPage:false});
                  await page.locator('.th2-mobile-close').click();
                  await page.waitForTimeout(120);
                }
              }
            }catch(e){failures.push(`${name}: ${e.message}`)} finally{await context.close()}
          }
          fs.writeFileSync('company-profile-premium-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('company-profile-premium-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node company-profile-premium-v2/capture.mjs
      - name: Upload Company Profile visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-company-profile-premium-v2
          path: company-profile-premium-v2
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then STATE=success; DESC='Company Profile Premium V2 QA passed'; else STATE=failure; DESC='Company Profile Premium V2 QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET Company Profile Premium V2 QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
