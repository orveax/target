name: TARGET Privacy Policy Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/privacy-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/privacy.astro'
      - '.github/workflows/privacy-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  privacy-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Privacy legal-reading contract
        run: |
          test -f public/assets/privacy-polish-v2.css
          grep -q 'privacy-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -q 'Visual center of gravity: legal reading system' public/assets/privacy-polish-v2.css
          grep -q '.privacy-section:target' public/assets/privacy-polish-v2.css
          grep -q 'overflow-x:auto' public/assets/privacy-polish-v2.css
          grep -q 'scroll-snap-type:x proximity' public/assets/privacy-polish-v2.css
          grep -q 'prefers-reduced-motion:reduce' public/assets/privacy-polish-v2.css
          grep -q 'info@targetft.com' src/pages/privacy.astro
          grep -q 'privacy-request' src/pages/privacy.astro
      - name: Build Astro site
        run: |
          npm install
          npm run build
