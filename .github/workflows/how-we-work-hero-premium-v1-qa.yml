name: TARGET How We Work Premium Hero V1 QA
on:
  push:
    branches:
      - feature/premium-hero-redesign
  workflow_dispatch:
jobs:
  how-we-work-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify How We Work Premium Hero V1 contract
        run: |
          set -euo pipefail
          HERO='public/assets/hero-how-we-work-premium-v1.css'
          REFINE='public/assets/how-we-work-final-refinement-v1.css'
          PAGE='src/components/HowWeWorkCanonical.astro'
          test -f "$HERO"
          grep -q "hero-how-we-work-premium-v1.css?v=20260817-01" "$REFINE"
          grep -q "pexels-photo-11679687" "$REFINE"
          grep -q "background:#222725!important" "$HERO"
          grep -q "PRODUCT → TARGET → QATAR" "$HERO"
          grep -q "html.handheld-desktop-mode .page-capabilities" "$HERO"
          grep -q 'class="work-hero"' "$PAGE"
          grep -q 'href="suppliers.html"' "$PAGE"
          echo 'TARGET HOW WE WORK PREMIUM HERO V1: PASS'
