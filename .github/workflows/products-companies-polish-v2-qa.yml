name: TARGET Products & Companies Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/products-companies-polish-v2.css'
      - 'public/assets/products-companies-polish-v2.js'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/food-portfolio.astro'
      - 'src/components/CompanyPortfolio.vue'
      - 'public/content/companies.json'
      - '.github/workflows/products-companies-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  products-companies-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify V2 visual contract and product album mapping
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/products-companies-polish-v2.css
          test -f public/assets/products-companies-polish-v2.js
          grep -Fq 'products-companies-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq 'products-companies-polish-v2.js?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq '.portfolio-principles article{' public/assets/products-companies-polish-v2.css
          grep -Fq 'background:var(--target-charcoal,#262626)!important' public/assets/products-companies-polish-v2.css
          grep -Fq '.company-tile-copy strong' public/assets/products-companies-polish-v2.css
          grep -Fq 'color:var(--target-charcoal,#262626)!important' public/assets/products-companies-polish-v2.css
          grep -Fq 'product-gallery--photo' public/assets/products-companies-polish-v2.css
          grep -Fq "'شاي'" public/assets/products-companies-polish-v2.js
          grep -Fq "'ينسون'" public/assets/products-companies-polish-v2.js
          grep -Fq "'ممبار'" public/assets/products-companies-polish-v2.js
          grep -Fq "'عسل أسود'" public/assets/products-companies-polish-v2.js
          grep -Fq "'خروب'" public/assets/products-companies-polish-v2.js
          grep -Fq "'رمان'" public/assets/products-companies-polish-v2.js
          grep -Fq 'AniseSeeds.jpg' public/assets/products-companies-polish-v2.js
          grep -Fq 'Hamam mahshi.jpg' public/assets/products-companies-polish-v2.js
          grep -Fq 'Egyptian food (mombar).jpg' public/assets/products-companies-polish-v2.js
          grep -Fq 'Blackstrapmolasses.JPG' public/assets/products-companies-polish-v2.js
          grep -Fq 'Carob pods and leaves in majorca arp.jpg' public/assets/products-companies-polish-v2.js
          ! grep -Fq "'فحم شيشة'" public/assets/products-companies-polish-v2.js
          grep -Fq '/content/companies.json' src/components/CompanyPortfolio.vue
          grep -Fq "status === 'active'" src/components/CompanyPortfolio.vue
      - name: Build Astro site
        run: |
          npm install
          npm run build
