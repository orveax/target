name: TARGET Products & Companies Premium V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/products-companies-canonical.css'
      - 'public/assets/products-companies-canonical-guard.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/food-portfolio.astro'
      - 'src/pages/products-companies.astro'
      - 'src/components/CompanyPortfolio.vue'
      - 'src/components/SiteHeader.astro'
      - 'src/components/SiteFooter.astro'
      - 'public/content/companies.json'
      - '.github/workflows/products-companies-polish-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  products-companies-premium-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Page 04 Premium V2 QA' --arg description 'Products & Companies QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: npm install
      - name: Verify Page 04 architecture and governance
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/products-companies-canonical.css
          test -f public/assets/products-companies-canonical-guard.css
          test ! -f public/assets/products-companies-polish-v1.css
          test ! -f public/assets/products-companies-polish-v2.css
          test ! -f public/assets/hero-products-premium-v1.css
          grep -Fq 'products-companies-canonical.css?v=20260818-02' src/layouts/BaseLayout.astro
          grep -Fq 'products-companies-canonical-guard.css?v=20260818-01' src/layouts/BaseLayout.astro
          ! grep -Fq 'products-companies-polish-v2.js' src/layouts/BaseLayout.astro
          grep -Fq 'portfolio-canonical' src/pages/food-portfolio.astro
          grep -Fq "import ProductsCompaniesPage from './food-portfolio.astro'" src/pages/products-companies.astro
          grep -Fq "products-companies.html','portfolio'" src/components/SiteHeader.astro
          grep -Fq 'href="products-companies.html"' src/components/SiteFooter.astro
          grep -Fq 'data-album-owner="vue"' src/components/CompanyPortfolio.vue
          grep -Fq '/content/companies.json' src/components/CompanyPortfolio.vue
          grep -Fq "status === 'active'" src/components/CompanyPortfolio.vue
          grep -Fq '"schemaVersion": 3' public/content/companies.json
          grep -Fq '"productOwnershipRule"' public/content/companies.json
          grep -Fq '"company-05"' public/content/companies.json
          grep -Fq '"status": "pending"' public/content/companies.json
          grep -Fq '"فحم شيشة"' public/content/companies.json
          ! grep -Fq 'فحم شيشة' src/pages/food-portfolio.astro
      - name: Build
        run: npm run build
      - name: Install Playwright package and use hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-products-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/products-companies.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-products-http.log
          exit 1
      - name: Capture and validate Page 04 visual and state contract
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p products-companies-premium-v2
          cat > products-companies-premium-v2-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/products-companies.html';
          const shots=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const expectedCompanies=[
            {name:'فالكون',products:['شاي','ينسون','كمومايل','قرفة','شاي أخضر','نعناع','تليا','شاي أبيض','زعتر','كركديه']},
            {name:'الندى',products:['جبنة رومي','حمام','كفتة','محشي','ممبار']},
            {name:'الدار',products:['عسل نحل','عسل أسود','حلويات شامية']},
            {name:'الريم',products:['برتقال','كركديه','خروب','تمر هندي','جوافة','مانجو','رمان']}
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of shots){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              const app=page.locator('.portfolio-app');
              await app.scrollIntoViewIfNeeded();
              await page.waitForSelector('.portfolio-company-grid .company-tile',{state:'visible',timeout:12000});
              await page.waitForTimeout(400);

              const companyResults=[];
              for(let i=0;i<expectedCompanies.length;i++){
                const expected=expectedCompanies[i];
                const tile=page.locator('.company-tile').nth(i);
                await tile.click();
                await page.waitForTimeout(220);
                const detail=page.locator('#company-detail');
                const selectedName=(await detail.locator('.company-profile-heading h3').innerText()).trim();
                const albumTitle=(await detail.locator('.company-products h3').innerText()).trim();
                const productNames=(await detail.locator('.product-photo-card .product-photo-copy strong').allTextContents()).map(x=>x.trim());
                const cardCount=await detail.locator('.product-photo-card').count();
                const visualCount=await detail.locator('.product-photo-frame').evaluateAll(nodes=>nodes.filter(node=>getComputedStyle(node).backgroundImage.includes('illustrative-product-atlas.webp')).length);
                companyResults.push({selectedName,albumTitle,productNames,cardCount,visualCount});
                if(selectedName!==expected.name) failures.push(`${name}: company ${i+1} selected ${selectedName} instead of ${expected.name}`);
                if(!albumTitle.includes(expected.name)) failures.push(`${name}: album title did not switch to ${expected.name}`);
                if(cardCount!==expected.products.length) failures.push(`${name}: ${expected.name} expected ${expected.products.length} products; found ${cardCount}`);
                if(JSON.stringify(productNames)!==JSON.stringify(expected.products)) failures.push(`${name}: ${expected.name} product list mismatch: ${productNames.join(' | ')}`);
                if(visualCount!==expected.products.length) failures.push(`${name}: ${expected.name} has ${expected.products.length-visualCount} product cards without atlas fallback visual`);
              }

              const principleStates=[];
              const principleCards=page.locator('.portfolio-principles > article');
              for(let i=0;i<await principleCards.count();i++){
                const card=principleCards.nth(i);
                await card.hover();
                const state=await card.evaluate(el=>{
                  const h3=el.querySelector('h3'); const p=el.querySelector('p');
                  const cs=getComputedStyle(el), hs=getComputedStyle(h3), ps=getComputedStyle(p);
                  return {background:cs.backgroundColor,h3:hs.color,h3Fill:hs.webkitTextFillColor,p:ps.color,pFill:ps.webkitTextFillColor};
                });
                principleStates.push(state);
                if(state.background!=='rgb(255, 255, 255)') failures.push(`${name}: focus card ${i+1} background changed from white on hover`);
                if(state.h3==='rgb(255, 255, 255)' || state.h3==='rgba(0, 0, 0, 0)' || state.h3Fill==='rgb(255, 255, 255)') failures.push(`${name}: focus card ${i+1} heading contrast failed`);
                if(state.p==='rgb(255, 255, 255)' || state.p==='rgba(0, 0, 0, 0)' || state.pFill==='rgb(255, 255, 255)') failures.push(`${name}: focus card ${i+1} body contrast failed`);
              }

              await page.evaluate(async()=>{
                const pause=(ms)=>new Promise(resolve=>setTimeout(resolve,ms));
                const step=Math.max(420,Math.floor(innerHeight*.68));
                const max=document.documentElement.scrollHeight;
                for(let y=0;y<max;y+=step){window.scrollTo(0,y);await pause(80);}
                window.scrollTo(0,max);await pause(250);window.scrollTo(0,0);await pause(250);
              });
              const m=await page.evaluate(()=>({
                width:innerWidth,
                path:location.pathname,
                overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                h1:document.querySelectorAll('.portfolio-canonical h1').length,
                sections:document.querySelectorAll('.portfolio-canonical > section').length,
                principles:document.querySelectorAll('.portfolio-principles > article').length,
                categories:document.querySelectorAll('.portfolio-category-grid > article').length,
                companies:document.querySelectorAll('.portfolio-company-grid .company-tile').length,
                pendingVisible:[...document.querySelectorAll('.company-tile')].some(x=>/company 05|company 06/i.test(x.textContent||'')),
                charcoalVisible:(document.body.innerText||'').includes('فحم شيشة'),
                albumOwner:document.querySelector('.portfolio-app')?.getAttribute('data-album-owner')||'',
                legacyAlbumScript:[...document.scripts].some(s=>(s.src||'').includes('products-companies-polish-v2.js'))
              }));
              metrics.push({name,...m,companyResults,principleStates});
              if(m.path!=='/products-companies.html') failures.push(`${name}: canonical route mismatch ${m.path}`);
              if(m.overflowX) failures.push(`${name}: horizontal overflow`);
              if(m.h1!==1) failures.push(`${name}: expected 1 H1; found ${m.h1}`);
              if(m.sections!==7) failures.push(`${name}: expected 7 canonical sections; found ${m.sections}`);
              if(m.principles!==3) failures.push(`${name}: expected 3 portfolio principles; found ${m.principles}`);
              if(m.categories!==5) failures.push(`${name}: expected 5 categories; found ${m.categories}`);
              if(m.companies!==4) failures.push(`${name}: expected 4 active companies; found ${m.companies}`);
              if(m.pendingVisible) failures.push(`${name}: pending company rendered publicly`);
              if(m.charcoalVisible) failures.push(`${name}: controlled adjacent non-food item surfaced publicly`);
              if(m.albumOwner!=='vue') failures.push(`${name}: Vue is not marked as album owner`);
              if(m.legacyAlbumScript) failures.push(`${name}: legacy DOM-mutating album script still loaded`);
              await page.screenshot({path:`products-companies-premium-v2/${name}-ar.png`,fullPage:true});
            }catch(e){failures.push(`${name}: ${e.message}`)} finally{await context.close();}
          }
          fs.writeFileSync('products-companies-premium-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('products-companies-premium-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          EOF
          node products-companies-premium-v2-capture.mjs
      - name: Upload Page 04 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-products-companies-premium-v2
          path: products-companies-premium-v2
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then
            STATE=success
            DESC='Products & Companies company-album QA passed'
          else
            STATE=failure
            DESC='Products & Companies company-album QA failed'
            if [[ -s products-companies-premium-v2/failures.txt ]]; then
              DESC="$(head -n 1 products-companies-premium-v2/failures.txt | cut -c1-135)"
            fi
          fi
          jq -n --arg state "$STATE" --arg context 'TARGET Page 04 Premium V2 QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
