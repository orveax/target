name: TARGET Production QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify routes and critical assets
        run: |
          for f in index about capabilities food-portfolio qatar-market contact faq privacy terms 404; do test -f "dist/$f.html"; done
          test -f dist/assets/brand/target-logo-horizontal-forest.svg
          test -f dist/assets/brand/target-logo-horizontal-cream.svg
          test -f dist/content/companies.json
      - name: Reject broken production asset references
        run: |
          ! grep -R "target-logo-horizontal-cream.png" dist
