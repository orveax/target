name: TARGET Canonical Website QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify canonical pages
        run: |
          test -f dist/index.html
          test -f dist/about.html
          test -f dist/capabilities.html
          test -f dist/food-portfolio.html
          test -f dist/qatar-market.html
          test -f dist/suppliers.html
          test -f dist/contact.html
          test -f dist/company-profile.html
          test -f dist/faq.html
          test -f dist/privacy.html
          test -f dist/terms.html
          test -f dist/404.html
      - name: Verify locked implementation assets
        run: |
          test -f dist/assets/target-design-tokens-v1.css
          test -f dist/assets/final-freeze-v1.css
          test -f dist/assets/final-freeze-media-v1.css
          test -f dist/assets/content-pages-final-v1.css
          test -f dist/assets/verified-contact-v1.css
          test -f dist/assets/company-profile-v1.css
          test -f dist/assets/faq-v1.css
          test -f dist/assets/privacy-v1.css
          test -f dist/assets/terms-v1.css
          test -f dist/content/target-design-tokens-v1.json
          test -f dist/content/companies.json
      - name: Verify internal company brochure resources
        run: |
          test -f dist/assets/companies/falcon/brochure.pdf
          test -f dist/assets/companies/al-nada/brochure.pdf
          test -f dist/assets/companies/al-dar/brochure.pdf
          test -f dist/assets/companies/al-reem/brochure.pdf
      - name: Verify approved contact data
        run: |
          grep -q '97477910919' dist/assets/premium-v6.js
          grep -q '97477910919' dist/assets/t5-conversion.js
          grep -q '25.1753889,51.6052222' dist/assets/contact-refinement-v2.js
          grep -q 'facebook.com/targetft' dist/contact.html
          grep -q 'instagram.com/targetft' dist/contact.html
          grep -q 'tiktok.com/@targetft' dist/contact.html
          ! grep -R -q '97400000000' dist
          ! grep -R -q '+974 XX' dist
      - name: Verify company profile resource route
        run: |
          grep -q 'أربع مسارات تكمل الصورة' dist/company-profile.html
          grep -q 'حمّل النسخة الرسمية من الملف التعريفي' dist/company-profile.html
          grep -q 'food-portfolio.html' dist/company-profile.html
          grep -q 'qatar-market.html' dist/company-profile.html
          ! grep -q 'href="#"' dist/company-profile.html
      - name: Verify canonical FAQ
        run: |
          grep -q 'faq-q01' dist/faq.html
          grep -q 'faq-q15' dist/faq.html
          grep -q 'إجابات واضحة قبل أن تبدأ' dist/faq.html
          grep -q 'لم تجد الإجابة التي تحتاجها' dist/faq.html
          grep -q 'partners@targetft.com' dist/faq.html
          ! grep -q 'Partnership Model' dist/faq.html
          ! grep -q 'Discover → Evaluate → Partner' dist/faq.html
      - name: Verify approved Privacy Policy
        run: |
          grep -q 'id="scope"' dist/privacy.html
          grep -q 'id="collect"' dist/privacy.html
          grep -q 'id="consent"' dist/privacy.html
          grep -q 'id="sharing"' dist/privacy.html
          grep -q 'id="rights"' dist/privacy.html
          grep -q 'id="cookies"' dist/privacy.html
          grep -q 'info@targetft.com' dist/privacy.html
          grep -q 'سياسة الخصوصية' dist/privacy.html
          grep -q 'ملفات الارتباط والتحليلات والتحديثات' dist/privacy.html
          ! grep -q 'Legal Review Required' dist/privacy.html
          ! grep -q 'Set at publication' dist/privacy.html
          ! grep -q 'noindex,nofollow' dist/privacy.html
      - name: Verify approved Terms and Conditions
        run: |
          grep -q 'id="use"' dist/terms.html
          grep -q 'id="purpose"' dist/terms.html
          grep -q 'id="commitment"' dist/terms.html
          grep -q 'id="information"' dist/terms.html
          grep -q 'id="submissions"' dist/terms.html
          grep -q 'id="ip"' dist/terms.html
          grep -q 'id="prohibited"' dist/terms.html
          grep -q 'id="third"' dist/terms.html
          grep -q 'id="accuracy"' dist/terms.html
          grep -q 'id="law"' dist/terms.html
          grep -q 'الموقع لا ينشئ التزامًا تجاريًا تلقائيًا' dist/terms.html
          grep -q 'info@targetft.com' dist/terms.html
          grep -q 'privacy.html' dist/terms.html
          grep -q 'contact.html' dist/terms.html
          ! grep -q 'Legal Review Required' dist/terms.html
          ! grep -q 'Set at publication' dist/terms.html
          ! grep -q 'noindex,nofollow' dist/terms.html
