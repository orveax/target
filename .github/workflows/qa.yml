name: TARGET Premium v6 Astro QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify expected pages
        run: |
          test -f dist/index.html
          test -f dist/about.html
          test -f dist/capabilities.html
          test -f dist/food-portfolio.html
          test -f dist/qatar-market.html
          test -f dist/contact.html
          test -f dist/faq.html
          test -f dist/privacy.html
          test -f dist/terms.html
          test -f dist/404.html
