name: TARGET Hero Visual Snapshot V1
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  site-hero-visual-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: npm install
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-http.log
          exit 1
      - name: Capture 11-page Hero matrix
        run: |
          mkdir -p visual-artifacts
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const origin = 'http://127.0.0.1:4173';
          const pages = [
            ['01-home','index.html','.hc-hero'],
            ['02-about','about.html','.about-hero'],
            ['03-how-we-work','capabilities.html','.work-hero'],
            ['04-products','food-portfolio.html','.portfolio-hero-final'],
            ['05-qatar-market','qatar-market.html','.qm-hero'],
            ['06-suppliers','suppliers.html','.fs-hero'],
            ['07-contact','contact.html','.ct-hero'],
            ['08-company-profile','company-profile.html','.cp-hero'],
            ['09-faq','faq.html','.faq-hero'],
            ['10-privacy','privacy.html','.privacy-hero'],
            ['11-terms','terms.html','.terms-hero']
          ];
          const shots = [
            ['1440', {viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['1280', {viewport:{width:1280,height:900},screen:{width:1280,height:900}}],
            ['1024', {viewport:{width:1024,height:900},screen:{width:1024,height:900}}],
            ['768', {viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['430', {viewport:{width:430,height:932},screen:{width:430,height:932},isMobile:true,hasTouch:true}],
            ['390', {viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}],
            ['360', {viewport:{width:360,height:800},screen:{width:360,height:800},isMobile:true,hasTouch:true}],
            ['390-desktop-site', {viewport:{width:980,height:1200},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];

          const allMetrics = [];
          for (const [slug, route, selector] of pages) {
            fs.mkdirSync(`visual-artifacts/${slug}`, {recursive:true});
            for (const [shotName, options] of shots) {
              const context = await browser.newContext(options);
              const page = await context.newPage();
              await page.goto(`${origin}/${route}`, {waitUntil:'networkidle'});
              await page.evaluate(async()=>{ if(document.fonts) await document.fonts.ready; });
              const hero = page.locator(selector);
              if (await hero.count() !== 1) throw new Error(`${slug}: expected exactly one ${selector}`);
              await hero.screenshot({path:`visual-artifacts/${slug}/${shotName}-ar.png`});
              const metrics = await hero.evaluate((el)=>{
                const r=el.getBoundingClientRect();
                return {
                  heroHeight:Math.round(r.height),
                  heroWidth:Math.round(r.width),
                  viewport:[window.innerWidth,window.innerHeight],
                  handheldDesktop:document.documentElement.classList.contains('handheld-desktop-mode'),
                  dir:document.documentElement.dir,
                  lang:document.documentElement.lang,
                  overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth
                };
              });
              allMetrics.push({slug,shotName,...metrics});
              if(metrics.overflowX) throw new Error(`${slug}/${shotName}: horizontal overflow detected`);
              await context.close();
            }
          }
          fs.writeFileSync('visual-artifacts/metrics.json', JSON.stringify(allMetrics,null,2));
          await browser.close();
          EOF
          node /tmp/capture.mjs
      - name: Upload visual matrix
        uses: actions/upload-artifact@v4
        with:
          name: target-11-page-hero-visual-matrix-v1
          path: visual-artifacts
          if-no-files-found: error
          retention-days: 14
