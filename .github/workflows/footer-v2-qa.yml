name: TARGET Global Footer V4 QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  footer-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify Footer V4 contract
        run: |
          test -f dist/assets/footer-premium-v2.css
          test -f dist/assets/footer-premium-v3.css
          test -f dist/assets/brand/target-logo-horizontal-cream.png
          test "$(stat -c%s dist/assets/brand/target-logo-horizontal-cream.png)" = "148199"
          grep -q 'footer-premium-v3.css?v=20260817-02' dist/index.html
          grep -q 'premium-footer-v3' dist/index.html
          grep -q 'target-logo-horizontal-cream.png' dist/index.html
          ! grep -q 'target-logo-horizontal-cream.svg' dist/index.html
          grep -q 'footer-nav-company' dist/index.html
          grep -q 'footer-nav-market' dist/index.html
          grep -q 'footer-nav-support' dist/index.html
          grep -q 'footer-nav-legal' dist/index.html
          grep -q 'footer-v3-contact-strip' dist/contact.html
          grep -q 'footer-v3-delivery' dist/index.html
          grep -q 'Digital Experience & Website Implementation' dist/index.html
          grep -q 'https://orveax.com' dist/index.html
          grep -q 'partners@targetft.com' dist/index.html
          grep -q 'sales@targetft.com' dist/index.html
          grep -q '97477910919' dist/index.html
          grep -q 'Open navigation columns' dist/assets/footer-premium-v3.css
          grep -q 'grid-template-columns:repeat(4,minmax(0,1fr))' dist/assets/footer-premium-v3.css
          grep -q 'gap:10px!important' dist/assets/footer-premium-v3.css
          grep -q 'footer-v3-logo-link:hover' dist/assets/footer-premium-v3.css
          grep -q 'if(footer.classList.contains' dist/assets/premium-v6.js
          ! grep -R -q 'RFX' dist
