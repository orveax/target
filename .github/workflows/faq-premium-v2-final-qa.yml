name: TARGET FAQ Premium V2 Final QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/faq-canonical.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/faq.astro'
      - '.github/workflows/faq-premium-v2-final-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  faq-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET FAQ Premium V2 Final QA' --arg description 'FAQ final QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/faq-canonical.css
          grep -Fq 'faq-canonical.css?v=20260818-02' src/layouts/BaseLayout.astro
          ! grep -Fq 'faq-v1.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'faq-polish-v2.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'hero-faq-premium-v1.css' src/layouts/BaseLayout.astro
          grep -Fq 'grid-template-columns:minmax(0,55fr) minmax(340px,45fr)' public/assets/faq-canonical.css
          grep -Fq 'scroll-margin-top:112px' public/assets/faq-canonical.css
          grep -Fq 'faq-q01' src/pages/faq.astro
          grep -Fq 'faq-q15' src/pages/faq.astro
          grep -Fq 'aria-controls' src/pages/faq.astro
          grep -Fq "item.addEventListener('toggle'" src/pages/faq.astro
          grep -Fq "target?.matches('details.faq-item')" src/pages/faq.astro
          ! grep -Fq 'Partnership Model' src/pages/faq.astro
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Prepare hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/faq-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/faq.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/faq-http.log; exit 1
      - name: Browser and interaction QA
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p faq-final-qa
          cat > faq-final-qa/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/faq.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const ctx=await browser.newContext(opts);
            const page=await ctx.newPage();
            try{
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              for(const lang of ['ar','en']){
                if(await page.locator('html').getAttribute('lang')!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(220);}
                const m=await page.evaluate(()=>{
                  const copy=document.querySelector('.faq-hero-copy').getBoundingClientRect();
                  const visual=document.querySelector('.faq-visual').getBoundingClientRect();
                  const items=[...document.querySelectorAll('details.faq-item')];
                  const topics=[...document.querySelectorAll('.faq-topic-cues a')];
                  return {
                    lang:document.documentElement.lang,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1:document.querySelectorAll('.page-faq h1').length,
                    groups:document.querySelectorAll('.faq-group').length,
                    items:items.length,
                    open:items.filter(x=>x.open).length,
                    ariaClosed:items.every(x=>x.querySelector('summary')?.getAttribute('aria-expanded')==='false'),
                    topics:topics.length,
                    support:document.querySelectorAll('.faq-support-actions .faq-btn').length,
                    pattern:getComputedStyle(document.querySelector('.faq-hero'),'::before').backgroundImage,
                    copyTop:copy.top,visualTop:visual.top,copyWidth:copy.width,visualWidth:visual.width
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1!==1||m.groups!==4||m.items!==15||m.topics!==4||m.support!==2) failures.push(`${name}-${lang}: canonical counts mismatch`);
                if(m.open!==0||!m.ariaClosed) failures.push(`${name}-${lang}: FAQ default closed/ARIA contract failed`);
                if(!m.pattern||m.pattern==='none') failures.push(`${name}-${lang}: hero pattern missing`);
                if(name==='1440'){
                  const ratio=m.copyWidth/m.visualWidth;
                  if(ratio<1.05||ratio>1.50) failures.push(`${name}-${lang}: hero ratio ${ratio.toFixed(2)} outside tolerance`);
                } else if(!(m.copyTop<m.visualTop)) failures.push(`${name}-${lang}: text must precede visual`);
                await page.screenshot({path:`faq-final-qa/${name}-${lang}-first-fold.png`,fullPage:false});
              }

              await page.goto(origin,{waitUntil:'networkidle'});
              await page.locator('#faq-q01 summary').click();
              await page.waitForTimeout(100);
              const opened=await page.locator('#faq-q01').evaluate(el=>({open:el.open,aria:el.querySelector('summary')?.getAttribute('aria-expanded')}));
              if(!opened.open||opened.aria!=='true') failures.push(`${name}: accordion interaction/ARIA failed`);

              await page.goto(origin+'#faq-q10',{waitUntil:'networkidle'});
              await page.waitForTimeout(220);
              const deep=await page.locator('#faq-q10').evaluate(el=>({open:el.open,aria:el.querySelector('summary')?.getAttribute('aria-expanded'),top:el.getBoundingClientRect().top}));
              if(!deep.open||deep.aria!=='true'||deep.top<70) failures.push(`${name}: deep-link contract failed`);

              if(name==='390'){
                await page.goto(origin,{waitUntil:'networkidle'});
                const chips=await page.locator('.faq-topic-cues').evaluate(el=>{
                  const links=[...el.querySelectorAll('a')];
                  const tops=links.map(a=>Math.round(a.getBoundingClientRect().top));
                  return {display:getComputedStyle(el).display,overflowX:getComputedStyle(el).overflowX,count:links.length,rows:new Set(tops).size};
                });
                if(chips.display!=='flex'||chips.overflowX!=='auto'||chips.count!==4||chips.rows!==1) failures.push('390: topic chips are not one compact horizontal row');
              }
              await page.screenshot({path:`faq-final-qa/${name}-interaction.png`,fullPage:true});
            }catch(e){failures.push(`${name}: ${e.message}`)}finally{await ctx.close()}
          }
          fs.writeFileSync('faq-final-qa/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('faq-final-qa/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node faq-final-qa/capture.mjs
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-faq-premium-v2-final
          path: faq-final-qa
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='FAQ final QA passed'; else STATE=failure; DESC='FAQ final QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET FAQ Premium V2 Final QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null

# trigger: canonical Page 09 final gate
