name: TARGET About Vision Mission Owner Polish QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/about-values-owner-polish-v1.css'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/about-values-owner-polish-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  vision-mission-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET About Vision Mission QA' --arg description 'Vision & Mission charcoal-card QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/about-values-owner-polish-v1.css
          grep -Fq 'about-values-owner-polish-v1.css?v=20260818-02' src/layouts/BaseLayout.astro
          grep -Fq 'About Vision & Mission Owner Polish V2' public/assets/about-values-owner-polish-v1.css
          grep -Fq 'content:none!important' public/assets/about-values-owner-polish-v1.css
          grep -Fq 'background:#262626!important' public/assets/about-values-owner-polish-v1.css
          grep -Fq 'position:absolute!important' public/assets/about-values-owner-polish-v1.css
          grep -Fq 'background:#F4EDE4!important' public/assets/about-values-owner-polish-v1.css
          grep -Fq 'opacity:.075!important' public/assets/about-values-owner-polish-v1.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Prepare Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/about-values-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/about.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/about-values-http.log; exit 1
      - name: Browser and interaction QA
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p about-values-qa
          cat > about-values-qa/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const failures=[]; const metrics=[];
          const sizes=[['1440',1440,1000],['768',768,1024],['390',390,844]];
          for(const [name,width,height] of sizes){
            const ctx=await browser.newContext({viewport:{width,height},isMobile:width===390,hasTouch:width===390});
            const page=await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/about.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{if(document.fonts)await document.fonts.ready});
            for(const lang of ['ar','en']){
              if(await page.locator('html').getAttribute('lang')!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(180)}
              const m=await page.evaluate(()=>{
                const values=document.querySelector('.about-values');
                const cards=[...document.querySelectorAll('.about-value-card')];
                const before=getComputedStyle(values,'::before');
                const after=getComputedStyle(values,'::after');
                const vs=getComputedStyle(values);
                return {
                  overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                  columns:vs.gridTemplateColumns,
                  sharedBefore:before.content,
                  sharedAfter:after.content,
                  cards:cards.map(c=>{
                    const cs=getComputedStyle(c);
                    const label=c.querySelector('.about-card-label');
                    const ls=getComputedStyle(label);
                    const icon=c.querySelector('.about-icon--large');
                    const is=getComputedStyle(icon);
                    const h3s=getComputedStyle(c.querySelector('h3'));
                    const ps=getComputedStyle(c.querySelector('p'));
                    return {
                      bg:cs.backgroundColor,
                      color:cs.color,
                      height:c.getBoundingClientRect().height,
                      borderTop:cs.borderTopColor,
                      labelText:label.textContent.trim(),
                      labelPosition:ls.position,
                      labelTop:ls.top,
                      labelHeight:label.getBoundingClientRect().height,
                      labelBg:ls.backgroundColor,
                      iconPosition:is.position,
                      iconOpacity:Number(is.opacity),
                      iconWidth:icon.getBoundingClientRect().width,
                      titleColor:h3s.color,
                      bodyColor:ps.color
                    };
                  })
                };
              });
              metrics.push({viewport:name,lang,...m});
              if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
              if(!['none','normal',''].includes((m.sharedBefore||'').replaceAll('"',''))) failures.push(`${name}-${lang}: rejected shared floating title is still rendered`);
              if(!['none','normal',''].includes((m.sharedAfter||'').replaceAll('"',''))) failures.push(`${name}-${lang}: rejected shared top rule is still rendered`);
              if(m.cards.length!==2) failures.push(`${name}-${lang}: expected two cards`);
              for(const [i,c] of m.cards.entries()){
                if(c.bg!=='rgb(38, 38, 38)') failures.push(`${name}-${lang}: card ${i+1} is not charcoal by default`);
                if(c.labelPosition!=='absolute'||c.labelHeight<40) failures.push(`${name}-${lang}: card ${i+1} upper-border label is not prominent`);
                if(c.iconPosition!=='absolute'||c.iconWidth<100||c.iconOpacity>.12) failures.push(`${name}-${lang}: card ${i+1} icon is not a restrained watermark`);
                if(!c.labelText) failures.push(`${name}-${lang}: card ${i+1} label missing`);
              }
              if(name==='390' && m.columns.split(' ').length>1) failures.push(`${name}-${lang}: mobile cards are not single-column`);
              await page.locator('.about-values-section').screenshot({path:`about-values-qa/${name}-${lang}-default.png`});
              if(name==='1440'){
                const card=page.locator('.about-value-card').first();
                await card.hover(); await page.waitForTimeout(340);
                const h=await card.evaluate(c=>{
                  const cs=getComputedStyle(c);
                  const label=c.querySelector('.about-card-label');
                  const icon=c.querySelector('.about-icon--large');
                  return {
                    bg:cs.backgroundColor,
                    transform:cs.transform,
                    labelBg:getComputedStyle(label).backgroundColor,
                    titleColor:getComputedStyle(c.querySelector('h3')).color,
                    iconColor:getComputedStyle(icon).color
                  };
                });
                if(h.bg!=='rgb(244, 237, 228)') failures.push(`${name}-${lang}: hover does not flip card to Off-White`);
                if(h.labelBg!=='rgb(244, 237, 228)') failures.push(`${name}-${lang}: hover label does not flip with card`);
                if(h.transform==='none') failures.push(`${name}-${lang}: hover lift missing`);
                if(h.titleColor!=='rgb(38, 38, 38)') failures.push(`${name}-${lang}: hover title is not charcoal`);
                await page.locator('.about-values-section').screenshot({path:`about-values-qa/${name}-${lang}-hover.png`});
              }
            }
            await ctx.close();
          }
          fs.writeFileSync('about-values-qa/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('about-values-qa/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node about-values-qa/check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-about-values-charcoal-cards
          path: about-values-qa
          retention-days: 14
      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Vision & Mission charcoal-card QA passed'; else STATE=failure; DESC='Vision & Mission charcoal-card QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET About Vision Mission QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
