name: TARGET Products & Companies Polish V1 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/products-companies-polish-v1.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/food-portfolio.astro'
      - 'src/components/CompanyPortfolio.vue'
      - 'public/content/companies.json'
      - '.github/workflows/products-companies-polish-v1-qa.yml'
  workflow_dispatch:

jobs:
  products-companies-polish-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Products & Companies canonical polish
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/products-companies-polish-v1.css
          grep -Fq 'products-companies-polish-v1.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq 'portfolio-hero-media' public/assets/products-companies-polish-v1.css
          grep -Fq '10907746' public/assets/products-companies-polish-v1.css
          grep -Fq 'grid-template-columns:repeat(6,minmax(0,1fr))' public/assets/products-companies-polish-v1.css
          grep -Fq '.portfolio-company-grid' public/assets/products-companies-polish-v1.css
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))' public/assets/products-companies-polish-v1.css
          grep -Fq '.visual-note' public/assets/products-companies-polish-v1.css
          grep -Fq '.company-resource-row:not(:has(a))' public/assets/products-companies-polish-v1.css
          grep -Fq 'client:visible' src/pages/food-portfolio.astro
          grep -Fq '/content/companies.json' src/components/CompanyPortfolio.vue
          grep -Fq 'status === '"'"'active'"'"'' src/components/CompanyPortfolio.vue
