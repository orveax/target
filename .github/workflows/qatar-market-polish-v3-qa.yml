name: TARGET Qatar Market Visual QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/qatar-market-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/qatar-market.astro'
      - '.github/workflows/qatar-market-polish-v3-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  qatar-market-visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Qatar Market Visual QA' --arg description 'Qatar Market visual QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Verify canonical Qatar Market contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'qatar-market-polish-v2.css?v=20260817-02' src/layouts/BaseLayout.astro
          grep -Fq 'فرصة المنتج في قطر تبدأ بفهم السوق قبل التحرك.' src/pages/qatar-market.astro
          grep -Fq 'أربع معلومات تساعدنا على فهم الفرصة بشكل أفضل.' src/pages/qatar-market.astro
          grep -Fq "index === 1 ? 'is-focus'" src/pages/qatar-market.astro
          grep -Fq "index === 1 ? 'is-center'" src/pages/qatar-market.astro
          grep -Fq 'qm-clarity-contact' src/pages/qatar-market.astro
          grep -Fq 'prefers-reduced-motion' public/assets/qatar-market-polish-v2.css
      - name: Install Playwright package and use hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-qatar-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/qatar-market.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-qatar-http.log
          exit 1
      - name: Capture and validate AR/EN visual contract
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p qatar-market-visual-qa
          cat > qatar-market-visual-qa/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/qatar-market.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{ if(document.fonts) await document.fonts.ready; });
              for(const lang of ['ar','en']){
                const current=await page.locator('html').getAttribute('lang');
                if(current!==lang){ await page.locator('[data-lang-toggle]').first().click(); await page.waitForTimeout(250); }
                await page.evaluate(async()=>{
                  const pause=(ms)=>new Promise(r=>setTimeout(r,ms));
                  const step=Math.max(420,Math.floor(innerHeight*.7));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await pause(90)}
                  scrollTo(0,0); await pause(300);
                });
                const m=await page.evaluate(()=>{
                  const rgb=v=>(v.match(/\d+(?:\.\d+)?/g)||[]).slice(0,3).map(Number);
                  const luminance=c=>{const a=c.map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*a[0]+.7152*a[1]+.0722*a[2]};
                  const contrast=(a,b)=>{const A=luminance(rgb(a)),B=luminance(rgb(b));return (Math.max(A,B)+.05)/(Math.min(A,B)+.05)};
                  const focus=document.querySelector('.qm-checkpoint-track article.is-focus');
                  const center=document.querySelector('.qm-channel-network article.is-center');
                  const hero=document.querySelector('.qm-hero');
                  const h1=document.querySelector('.qm-hero h1');
                  const images=[...document.querySelectorAll('.qm-hero-media img,.qm-context-media img')];
                  return {
                    lang:document.documentElement.lang,
                    width:innerWidth,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1Count:document.querySelectorAll('.page-qatar-market h1').length,
                    sectionCount:document.querySelectorAll('main > section').length,
                    contextPoints:document.querySelectorAll('.qm-context-points article').length,
                    reviewRows:document.querySelectorAll('.qm-checklist article').length,
                    checkpoints:document.querySelectorAll('.qm-checkpoint-track article').length,
                    focusedCheckpoints:document.querySelectorAll('.qm-checkpoint-track article.is-focus').length,
                    channels:document.querySelectorAll('.qm-channel-network article').length,
                    centeredChannels:document.querySelectorAll('.qm-channel-network article.is-center').length,
                    clarityLinks:document.querySelectorAll('.qm-clarity-contact').length,
                    heroBg:getComputedStyle(hero).backgroundColor,
                    h1Color:getComputedStyle(h1).color,
                    focusBg:getComputedStyle(focus).backgroundColor,
                    focusHeading:getComputedStyle(focus.querySelector('h3')).color,
                    focusHeadingContrast:contrast(getComputedStyle(focus.querySelector('h3')).color,getComputedStyle(focus).backgroundColor),
                    centerHeading:getComputedStyle(center.querySelector('h3')).color,
                    pendingImages:images.filter(img=>!img.complete||img.naturalWidth<20).length
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1Count!==1) failures.push(`${name}-${lang}: expected 1 H1, found ${m.h1Count}`);
                if(m.contextPoints!==4) failures.push(`${name}-${lang}: expected 4 market-context points`);
                if(m.reviewRows!==4) failures.push(`${name}-${lang}: expected 4 review rows`);
                if(m.checkpoints!==4||m.focusedCheckpoints!==1) failures.push(`${name}-${lang}: checkpoint state contract failed`);
                if(m.channels!==3||m.centeredChannels!==1) failures.push(`${name}-${lang}: channel state contract failed`);
                if(m.clarityLinks!==1) failures.push(`${name}-${lang}: expected one clarity Contact Us action`);
                if(m.focusHeadingContrast<4.5) failures.push(`${name}-${lang}: focused checkpoint heading contrast ${m.focusHeadingContrast.toFixed(2)} < 4.5`);
                if(m.pendingImages>0) failures.push(`${name}-${lang}: ${m.pendingImages} primary/support images failed to load`);
                await page.screenshot({path:`qatar-market-visual-qa/${name}-${lang}.png`,fullPage:true});
              }
            }catch(e){failures.push(`${name}: ${e.message}`)} finally{await context.close()}
          }
          fs.writeFileSync('qatar-market-visual-qa/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('qatar-market-visual-qa/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node qatar-market-visual-qa/capture.mjs
      - name: Upload visual audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-qatar-market-visual-qa
          path: qatar-market-visual-qa
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then STATE=success; DESC='Qatar Market visual QA passed'; else STATE=failure; DESC='Qatar Market visual QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET Qatar Market Visual QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
