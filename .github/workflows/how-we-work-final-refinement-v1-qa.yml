name: TARGET How We Work Premium V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/how-we-work-canonical.css'
      - 'src/components/HowWeWorkCanonical.astro'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/how-we-work-final-refinement-v1-qa.yml'
  workflow_dispatch:

jobs:
  how-we-work-premium-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project
        run: npm install
      - name: Verify authoritative Page 03 architecture
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/how-we-work-canonical.css
          test ! -f public/assets/how-we-work-visual-polish.css
          test ! -f public/assets/how-we-work-final-refinement-v1.css
          test ! -f public/assets/how-we-work-polish-v3.css
          test ! -f public/assets/hero-how-we-work-premium-v1.css
          grep -Fq 'how-we-work-canonical.css?v=20260818-01' src/layouts/BaseLayout.astro
          ! grep -Fq 'how-we-work-visual-polish.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'how-we-work-final-refinement-v1.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'how-we-work-polish-v3.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'hero-how-we-work-premium-v1.css' src/layouts/BaseLayout.astro
          grep -Fq '5953777' public/assets/how-we-work-canonical.css
          grep -Fq '.work-steps::before' public/assets/how-we-work-canonical.css
          grep -Fq 'inset-inline-start:50%' public/assets/how-we-work-canonical.css
          grep -Fq '.work-info-layout::before' public/assets/how-we-work-canonical.css
          grep -Fq '.work-clarity__panel' public/assets/how-we-work-canonical.css
          grep -Fq '.work-audience-focus' public/assets/how-we-work-canonical.css
          grep -Fq 'فئات نركز عليها' src/components/HowWeWorkCanonical.astro
          grep -Fq 'ناقش منتجك معنا' src/components/HowWeWorkCanonical.astro
          grep -Fq 'إرسال الاستفسار لا يعني قبول المنتج أو إنشاء التزام تجاري.' src/components/HowWeWorkCanonical.astro
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-how-we-work-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/capabilities.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-how-we-work-http.log
          exit 1
      - name: Capture Page 03 full-page desktop and mobile
        run: |
          mkdir -p how-we-work-premium-v2
          cat > how-we-work-premium-v2-capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const origin='http://127.0.0.1:4173/capabilities.html';
          const shots=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const metrics=[]; const failures=[];
          for(const [name,opts] of shots){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              await page.screenshot({path:`how-we-work-premium-v2/${name}-ar.png`,fullPage:true});
              const m=await page.evaluate(()=>({
                width:window.innerWidth,
                height:document.documentElement.scrollHeight,
                overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                h1:document.querySelectorAll('.work-canonical h1').length,
                sections:document.querySelectorAll('.work-canonical > section').length,
                ways:document.querySelectorAll('.work-way').length,
                steps:document.querySelectorAll('.work-steps > li').length,
                audiences:document.querySelectorAll('.work-audiences > article').length,
                startCues:document.querySelectorAll('.work-info-cues > li').length
              }));
              metrics.push({name,...m});
              if(m.overflowX) failures.push(`${name}: horizontal overflow`);
              if(m.h1!==1) failures.push(`${name}: expected 1 H1; found ${m.h1}`);
              if(m.sections!==7) failures.push(`${name}: expected 7 canonical sections; found ${m.sections}`);
              if(m.ways!==4) failures.push(`${name}: expected 4 core ways; found ${m.ways}`);
              if(m.steps!==6) failures.push(`${name}: expected 6 process steps; found ${m.steps}`);
              if(m.audiences!==4) failures.push(`${name}: expected 4 audience cards; found ${m.audiences}`);
              if(m.startCues!==4) failures.push(`${name}: expected 4 start cues; found ${m.startCues}`);
            }catch(e){failures.push(`${name}: ${e.message}`)}
            finally{await context.close();}
          }
          fs.writeFileSync('how-we-work-premium-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('how-we-work-premium-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1);}
          EOF
          node how-we-work-premium-v2-capture.mjs
      - name: Upload Page 03 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-how-we-work-premium-v2
          path: how-we-work-premium-v2
          if-no-files-found: error
          retention-days: 14
