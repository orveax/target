name: TARGET FAQ Premium V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/faq-canonical.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/faq.astro'
      - '.github/workflows/faq-polish-v2-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  faq-premium-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET FAQ Premium V2 QA' --arg description 'FAQ Premium V2 QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical FAQ contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/faq-canonical.css
          grep -Fq 'faq-canonical.css?v=20260818-01' src/layouts/BaseLayout.astro
          ! grep -Fq 'faq-v1.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'faq-polish-v2.css' src/layouts/BaseLayout.astro
          ! grep -Fq 'hero-faq-premium-v1.css' src/layouts/BaseLayout.astro
          grep -Fq 'grid-template-columns:minmax(0,55fr) minmax(340px,45fr)' public/assets/faq-canonical.css
          grep -Fq 'scroll-margin-top:112px' public/assets/faq-canonical.css
          grep -Fq 'prefers-reduced-motion:reduce' public/assets/faq-canonical.css
          grep -Fq 'faq-q01' src/pages/faq.astro
          grep -Fq 'faq-q15' src/pages/faq.astro
          grep -Fq 'aria-controls' src/pages/faq.astro
          grep -Fq 'aria-expanded="false"' src/pages/faq.astro
          grep -Fq "item.addEventListener('toggle'" src/pages/faq.astro
          grep -Fq "target?.matches('details.faq-item')" src/pages/faq.astro
          ! grep -Fq 'Partnership Model' src/pages/faq.astro
          ! grep -Fq 'Discover → Evaluate → Partner' src/pages/faq.astro
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Install Playwright package and use hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-faq-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/faq.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-faq-http.log
          exit 1
      - name: Capture and validate AR/EN FAQ contract
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p faq-premium-v2
          cat > faq-premium-v2/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/faq.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              for(const lang of ['ar','en']){
                const current=await page.locator('html').getAttribute('lang');
                if(current!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(220);}
                const m=await page.evaluate(()=>{
                  const copy=document.querySelector('.faq-hero-copy');
                  const media=document.querySelector('.faq-visual');
                  const cr=copy.getBoundingClientRect(), mr=media.getBoundingClientRect();
                  const items=[...document.querySelectorAll('details.faq-item')];
                  const groups=[...document.querySelectorAll('.faq-group')];
                  const topicLinks=[...document.querySelectorAll('.faq-topic-cues a')];
                  return {
                    lang:document.documentElement.lang,
                    width:innerWidth,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1Count:document.querySelectorAll('.page-faq h1').length,
                    groupCount:groups.length,
                    itemCount:items.length,
                    openCount:items.filter(x=>x.open).length,
                    topicCount:topicLinks.length,
                    topicHrefOk:topicLinks.every(a=>(a.getAttribute('href')||'').startsWith('#')),
                    ariaClosed:items.every(x=>x.querySelector('summary')?.getAttribute('aria-expanded')==='false'),
                    copyTop:cr.top,mediaTop:mr.top,copyWidth:cr.width,mediaWidth:mr.width,
                    heroPattern:getComputedStyle(document.querySelector('.faq-hero'),'::before').backgroundImage,
                    supportActions:document.querySelectorAll('.faq-support-actions .faq-btn').length
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1Count!==1) failures.push(`${name}-${lang}: expected one H1`);
                if(m.groupCount!==4) failures.push(`${name}-${lang}: expected 4 FAQ groups`);
                if(m.itemCount!==15) failures.push(`${name}-${lang}: expected 15 FAQ items`);
                if(m.openCount!==0||!m.ariaClosed) failures.push(`${name}-${lang}: FAQ items must default closed with aria-expanded=false`);
                if(m.topicCount!==4||!m.topicHrefOk) failures.push(`${name}-${lang}: topic anchor cues incomplete`);
                if(m.supportActions!==2) failures.push(`${name}-${lang}: support CTA hierarchy incomplete`);
                if(!m.heroPattern||m.heroPattern==='none') failures.push(`${name}-${lang}: hero pattern not rendered`);
                if(name==='1440'){
                  const ratio=m.copyWidth/m.mediaWidth;
                  if(ratio<1.05||ratio>1.50) failures.push(`${name}-${lang}: desktop hero ratio ${ratio.toFixed(2)} outside 55/45 tolerance`);
                } else if(!(m.copyTop<m.mediaTop)) failures.push(`${name}-${lang}: mobile/tablet must show text before visual`);
                await page.screenshot({path:`faq-premium-v2/${name}-${lang}-first-fold.png`,fullPage:false});
              }

              // Accordion interaction + ARIA sync.
              await page.goto(origin,{waitUntil:'networkidle'});
              const first=page.locator('#faq-q01');
              await first.locator('summary').click();
              await page.waitForTimeout(120);
              const interaction=await first.evaluate(el=>({open:el.open,aria:el.querySelector('summary')?.getAttribute('aria-expanded')}));
              if(!interaction.open||interaction.aria!=='true') failures.push(`${name}: accordion open state/aria sync failed`);

              // Deep-link target must open automatically and remain below sticky header.
              await page.goto(origin+'#faq-q10',{waitUntil:'networkidle'});
              await page.waitForTimeout(250);
              const deep=await page.locator('#faq-q10').evaluate(el=>({open:el.open,aria:el.querySelector('summary')?.getAttribute('aria-expanded'),top:el.getBoundingClientRect().top}));
              if(!deep.open||deep.aria!=='true') failures.push(`${name}: deep-linked FAQ target did not open`);
              if(deep.top<70) failures.push(`${name}: deep-linked FAQ target is hidden under sticky header`);

              if(name==='390'){
                await page.goto(origin,{waitUntil:'networkidle'});
                const mobileTopics=await page.locator('.faq-topic-cues').evaluate(el=>({scrollWidth:el.scrollWidth,clientWidth:el.clientWidth,display:getComputedStyle(el).display,overflowX:getComputedStyle(el).overflowX}));
                if(!(mobileTopics.scrollWidth>mobileTopics.clientWidth)||mobileTopics.overflowX!=='auto') failures.push('390: mobile topic cues are not horizontally scrollable');
              }
              await page.screenshot({path:`faq-premium-v2/${name}-interaction.png`,fullPage:true});
            }catch(e){failures.push(`${name}: ${e.message}`)} finally{await context.close()}
          }
          fs.writeFileSync('faq-premium-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('faq-premium-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node faq-premium-v2/capture.mjs
      - name: Upload FAQ visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-faq-premium-v2
          path: faq-premium-v2
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then STATE=success; DESC='FAQ Premium V2 QA passed'; else STATE=failure; DESC='FAQ Premium V2 QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET FAQ Premium V2 QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
