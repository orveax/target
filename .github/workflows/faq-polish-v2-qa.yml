name: TARGET FAQ Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/faq-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/faq.astro'
      - '.github/workflows/faq-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  faq-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify FAQ visual contract
        run: |
          test -f public/assets/faq-polish-v2.css
          grep -q 'faq-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -q 'Accordion is the page center of gravity' public/assets/faq-polish-v2.css
          grep -q '.faq-item\[open\]' public/assets/faq-polish-v2.css
          grep -q 'overflow-x:auto' public/assets/faq-polish-v2.css
          grep -q 'prefers-reduced-motion:reduce' public/assets/faq-polish-v2.css
          grep -q 'const groups' src/pages/faq.astro
          grep -q 'faq-q15' src/pages/faq.astro
      - name: Build Astro site
        run: |
          npm install
          npm run build
