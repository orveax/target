name: TARGET Handheld Desktop Hero V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/handheld-desktop-hero-v2.css'
      - 'public/assets/handheld-desktop-mode-v1.js'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/**'
      - 'src/components/AboutCanonical.astro'
      - 'src/components/HowWeWorkCanonical.astro'
      - '.github/workflows/handheld-desktop-hero-v2-qa.yml'
  workflow_dispatch:

jobs:
  hero-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Verify handheld desktop detection remains scoped
        run: |
          grep -F "handheld-desktop-mode" public/assets/handheld-desktop-mode-v1.js
          grep -F "shortSide<=620" public/assets/handheld-desktop-mode-v1.js
          grep -F "wideLayout=window.innerWidth>=760 && window.innerWidth<=1180" public/assets/handheld-desktop-mode-v1.js
      - name: Verify global hero V2 is loaded after prior handheld layers
        run: |
          grep -F '/assets/handheld-desktop-hero-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          test "$(grep -o 'handheld-desktop-hero-v2.css' src/layouts/BaseLayout.astro | wc -l)" -eq 1
      - name: Verify every canonical hero participates in the compact desktop contract
        run: |
          for token in \
            '.hc-hero-grid' \
            '.about-hero__grid' \
            '.work-hero__grid' \
            '.portfolio-hero-grid' \
            '.qm-hero-grid' \
            '.fs-hero-grid' \
            '.ct-hero-grid' \
            '.cp-hero-grid' \
            '.faq-hero-grid' \
            '.privacy-hero-grid' \
            '.terms-hero-grid'; do
            grep -F "$token" public/assets/handheld-desktop-hero-v2.css
          done
      - name: Verify compact-desktop geometry and media constraints
        run: |
          grep -F -- '--hd-hero-shell:920px' public/assets/handheld-desktop-hero-v2.css
          grep -F 'grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr)' public/assets/handheld-desktop-hero-v2.css
          grep -F 'height:330px!important' public/assets/handheld-desktop-hero-v2.css
          grep -F 'object-fit:cover!important' public/assets/handheld-desktop-hero-v2.css
          grep -F 'min-width:0!important' public/assets/handheld-desktop-hero-v2.css
      - name: Verify normal mobile and real desktop are not globally overwritten
        run: |
          test "$(grep -c '^html.handheld-desktop-mode' public/assets/handheld-desktop-hero-v2.css)" -gt 10
          if grep -E '^\.(about|work|portfolio|qm|fs|ct|cp|faq|privacy|terms)-hero' public/assets/handheld-desktop-hero-v2.css; then
            echo 'Found an unscoped hero override.'
            exit 1
          fi
