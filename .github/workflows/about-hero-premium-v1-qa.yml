name: TARGET About Premium Hero V1 QA
on:
  push:
    branches:
      - feature/premium-hero-redesign
  workflow_dispatch:
jobs:
  about-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify About Premium Hero V1 contract
        run: |
          set -euo pipefail
          HERO='public/assets/hero-about-premium-v1.css'
          PHOTO='public/assets/about-real-photography-v2.css'
          ABOUT='src/components/AboutCanonical.astro'
          test -f "$HERO"
          grep -q "hero-about-premium-v1.css?v=20260817-01" "$PHOTO"
          grep -q "pexels-photo-4481260" "$PHOTO"
          grep -q "background:#F4EDE4!important" "$HERO"
          grep -q "min-height:clamp(650px,76vh,820px)" "$HERO"
          grep -q "QATAR · FOOD TRADE" "$HERO"
          grep -q "html.handheld-desktop-mode .page-about" "$HERO"
          grep -q 'class="about-hero"' "$ABOUT"
          grep -q 'href="company-profile.html"' "$ABOUT"
          echo 'TARGET ABOUT PREMIUM HERO V1: PASS'
