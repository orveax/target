name: TARGET Mobile Menu Authoritative V2.4 QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mobile-menu-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify V2.4 authoritative mobile contract
        run: |
          set -euo pipefail
          CSS='public/assets/mobile-menu-viewport-fit-v21.css'
          HEADER='src/components/SiteHeader.astro'
          LAYOUT='src/layouts/BaseLayout.astro'
          test -f "$CSS"
          grep -q 'height:100dvh!important' "$CSS"
          grep -q '.th2-mobile-intro{display:none!important}' "$CSS"
          grep -q 'grid-template-columns:24px 34px minmax(0,1fr) 18px!important' "$CSS"
          grep -q 'grid-template-rows:48px!important' "$CSS"
          grep -q '.th2-mobile-route-icon' "$CSS"
          grep -q 'stroke-width:1.85!important' "$CSS"
          grep -q 'background:transparent!important' "$CSS"
          grep -q 'border-radius:0!important' "$CSS"
          grep -q 'target-logo-horizontal-light.svg' "$HEADER"
          test "$(grep -o 'class=\"th2-mobile-route-icon\"' "$HEADER" | wc -l)" -eq 5
          test "$(grep -o 'class=\"th2-mobile-route-arrow\"' "$HEADER" | wc -l)" -eq 5
          ! grep -q 'premium-mobile-head th2-mobile-head' "$HEADER"
          ! grep -q 'premium-mobile-brand th2-mobile-brand' "$HEADER"
          ! grep -q 'premium-mobile-links th2-mobile-primary' "$HEADER"
          ! grep -q 'premium-mobile-secondary th2-mobile-secondary' "$HEADER"
          grep -q 'mobile-menu-viewport-fit-v21.css?v=20260817-04' "$LAYOUT"
          echo 'TARGET MOBILE MENU V2.4: PASS'
