name: TARGET Mobile Menu Five Routes First V2.2 QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mobile-menu-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify five-routes-first mobile contract
        run: |
          test -f public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:100dvh!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'min-height:0!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'overflow-y:auto!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q '.th2-mobile-intro{display:none!important}' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:48px!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:44px!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'max-height: 680px' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'max-height: 520px' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'mobile-menu-viewport-fit-v21.css?v=20260817-01' src/layouts/BaseLayout.astro
          test "$(grep -o '<a class:list={[[]'\''nav-link' src/components/SiteHeader.astro | wc -l)" -ge 5
