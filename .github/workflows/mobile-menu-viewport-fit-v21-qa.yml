name: TARGET Responsive Navigation Final QA

on:
  push:
    branches: [main]
    paths:
      - 'src/components/SiteHeader.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'public/assets/header-premium-v2.css'
      - 'public/assets/mobile-menu-viewport-fit-v21.css'
      - 'public/assets/navigation-close-control-final-v1.css'
      - 'public/assets/header-premium-v2.js'
      - '.github/workflows/mobile-menu-viewport-fit-v21-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  responsive-navigation-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET Responsive Navigation Final QA' --arg description 'Responsive navigation QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and build
        run: |
          npm ci
          npm run build

      - name: Verify final navigation ownership contract
        shell: bash
        run: |
          set -euo pipefail
          CSS='public/assets/navigation-close-control-final-v1.css'
          HEADER='src/components/SiteHeader.astro'
          LAYOUT='src/layouts/BaseLayout.astro'
          RUNTIME='public/assets/header-premium-v2.js'
          test -f "$CSS"
          grep -Fq -- '--target-nav-close-size:42px' "$CSS"
          grep -Fq -- '--target-nav-close-size:46px' "$CSS"
          grep -Fq -- '--target-nav-close-size:48px' "$CSS"
          grep -Fq -- 'max-height:760px' "$CSS"
          grep -Fq 'place-items:center!important' "$CSS"
          grep -Fq 'vector-effect:non-scaling-stroke!important' "$CSS"
          grep -Fq 'navigation-close-control-final-v1.css?v=20260819-01' "$LAYOUT"
          grep -Fq 'header-premium-v2.js?v=20260819-02' "$LAYOUT"
          ! grep -Fq 'normalizeCloseGlyph' "$RUNTIME"
          grep -Fq 'd-md-none' "$HEADER"
          grep -Fq 'd-none d-md-block d-xl-none' "$HEADER"
          grep -Fq 'aria-label="Tablet navigation"' "$HEADER"
          grep -Fq 'class="th2-mobile-close"' "$HEADER"

      - name: Prepare hosted Chrome
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/target-nav-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/capabilities.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/target-nav-http.log
          exit 1

      - name: Validate close control across viewport matrix
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p responsive-navigation-final
          cat > responsive-navigation-final/validate.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({headless:true, executablePath:process.env.CHROME_PATH});
          const origin = 'http://127.0.0.1:4173/capabilities.html';
          const viewports = [
            ['phone-390x844',390,844],
            ['phone-430x932',430,932],
            ['tablet-768x1024',768,1024],
            ['tablet-800x1280',800,1280],
            ['tablet-820x1180',820,1180],
            ['tablet-834x1194',834,1194],
            ['tablet-912x1368',912,1368],
            ['tablet-1024x1366',1024,1366],
            ['large-portrait-1080x1440',1080,1440],
            ['wide-short-1180x820',1180,820],
            ['offcanvas-edge-1199x900',1199,900]
          ];

          const expected = (w,h) => {
            if (w <= 767) return {button:42,glyph:20};
            if (h <= 760) return {button:44,glyph:20};
            if (w <= 899) return {button:46,glyph:21};
            return {button:48,glyph:22};
          };

          const failures=[];
          const metrics=[];

          for (const [name,width,height] of viewports) {
            for (const lang of ['ar','en']) {
              const ctx = await browser.newContext({viewport:{width,height}});
              const page = await ctx.newPage();
              try {
                await page.goto(origin,{waitUntil:'networkidle'});
                await page.evaluate(async()=>{ if(document.fonts) await document.fonts.ready; });
                await page.waitForTimeout(180);

                if ((await page.locator('html').getAttribute('lang')) !== lang) {
                  await page.locator('[data-lang-toggle]').first().click();
                  await page.waitForTimeout(180);
                }

                const trigger = page.locator('.th2-menu-button');
                if (!(await trigger.isVisible())) {
                  failures.push(`${name}-${lang}: menu trigger is not visible below 1200px`);
                  await ctx.close();
                  continue;
                }

                await trigger.click();
                const nav = page.locator('#mobileNav');
                await page.waitForFunction(() => document.querySelector('#mobileNav')?.classList.contains('show'), null, {timeout:2500});
                await page.waitForTimeout(60);

                const m = await page.evaluate(() => {
                  const button = document.querySelector('.th2-mobile-close');
                  const svg = button?.querySelector('svg');
                  const head = document.querySelector('.th2-mobile-head');
                  const b = button?.getBoundingClientRect();
                  const s = svg?.getBoundingClientRect();
                  const h = head?.getBoundingClientRect();
                  const style = button ? getComputedStyle(button) : null;
                  return {
                    lang:document.documentElement.lang,
                    dir:document.documentElement.dir,
                    overflowX:document.documentElement.scrollWidth > document.documentElement.clientWidth,
                    button:b ? {x:b.x,y:b.y,w:b.width,h:b.height,cx:b.x+b.width/2,cy:b.y+b.height/2} : null,
                    glyph:s ? {x:s.x,y:s.y,w:s.width,h:s.height,cx:s.x+s.width/2,cy:s.y+s.height/2} : null,
                    head:h ? {x:h.x,y:h.y,w:h.width,h:h.height,right:h.right,bottom:h.bottom} : null,
                    display:style?.display,
                    lineHeight:style?.lineHeight,
                    aria:button?.getAttribute('aria-label') || '',
                    open:document.querySelector('#mobileNav')?.classList.contains('show') || false
                  };
                });

                metrics.push({name,width,height,...m});
                const exp=expected(width,height);

                if (!m.button || !m.glyph || !m.head) failures.push(`${name}-${lang}: close geometry missing`);
                else {
                  if (Math.abs(m.button.w-m.button.h)>0.6) failures.push(`${name}-${lang}: close button is not square (${m.button.w}x${m.button.h})`);
                  if (Math.abs(m.button.w-exp.button)>1.1) failures.push(`${name}-${lang}: button ${m.button.w}px expected ${exp.button}px`);
                  if (Math.abs(m.glyph.w-exp.glyph)>1.1 || Math.abs(m.glyph.h-exp.glyph)>1.1) failures.push(`${name}-${lang}: glyph ${m.glyph.w}x${m.glyph.h}px expected ${exp.glyph}px`);
                  if (Math.abs(m.button.cx-m.glyph.cx)>1.0 || Math.abs(m.button.cy-m.glyph.cy)>1.0) failures.push(`${name}-${lang}: glyph is off-center by ${Math.abs(m.button.cx-m.glyph.cx).toFixed(2)}x${Math.abs(m.button.cy-m.glyph.cy).toFixed(2)}px`);
                  if (m.button.x < m.head.x-1 || m.button.y < m.head.y-1 || m.button.x+m.button.w > m.head.right+1 || m.button.y+m.button.h > m.head.bottom+1) failures.push(`${name}-${lang}: close button escapes header bounds`);
                }
                if (m.overflowX) failures.push(`${name}-${lang}: horizontal document overflow`);
                if (!m.open) failures.push(`${name}-${lang}: offcanvas did not reach open state`);
                if (!m.aria) failures.push(`${name}-${lang}: close button missing accessible label`);

                await page.locator('.th2-mobile-close').click();
                await page.waitForFunction(() => {
                  const el=document.querySelector('#mobileNav');
                  return el && !el.classList.contains('show') && !el.classList.contains('showing') && !el.classList.contains('hiding');
                }, null, {timeout:2500});
                const stillOpen=await nav.evaluate((el)=>el.classList.contains('show')||el.classList.contains('showing')||el.classList.contains('hiding'));
                if (stillOpen) failures.push(`${name}-${lang}: close button did not reach closed state`);
              } catch (e) {
                failures.push(`${name}-${lang}: ${e.message}`);
              } finally {
                await ctx.close();
              }
            }
          }

          fs.writeFileSync('responsive-navigation-final/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('responsive-navigation-final/failures.txt',failures.join('\n'));
          await browser.close();
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`TARGET RESPONSIVE NAVIGATION: PASS (${metrics.length} state samples)`);
          EOF
          node responsive-navigation-final/validate.mjs

      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='Responsive navigation final QA passed'; else STATE=failure; DESC='Responsive navigation final QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET Responsive Navigation Final QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
