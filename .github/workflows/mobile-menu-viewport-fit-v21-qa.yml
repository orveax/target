name: TARGET Mobile Menu Alignment + Brand Fit V2.3 QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mobile-menu-fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify V2.3 mobile alignment and brand-fit contract
        run: |
          test -f public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:100dvh!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q '.th2-mobile-intro{display:none!important}' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'grid-template-columns:22px 30px minmax(0,1fr) 15px!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q '.th2-mobile-route-icon' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'place-items:center!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'stroke-width:1.9!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:48px!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'height:44px!important' public/assets/mobile-menu-viewport-fit-v21.css
          grep -q 'target-logo-horizontal-light.svg' src/components/SiteHeader.astro
          test "$(grep -o 'class=\"th2-mobile-route-icon\"' src/components/SiteHeader.astro | wc -l)" -eq 5
          test "$(grep -o 'class=\"th2-mobile-route-arrow\"' src/components/SiteHeader.astro | wc -l)" -eq 5
          grep -q 'mobile-menu-viewport-fit-v21.css?v=20260817-03' src/layouts/BaseLayout.astro
