name: TARGET Qatar Market Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/qatar-market-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/qatar-market.astro'
      - '.github/workflows/qatar-market-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  qatar-market-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Qatar Market real-photography refinement
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/qatar-market-polish-v2.css
          grep -Fq 'qatar-market-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq '10907746' public/assets/qatar-market-polish-v2.css
          grep -Fq '12081286' public/assets/qatar-market-polish-v2.css
          grep -Fq '.qm-hero-media>img' public/assets/qatar-market-polish-v2.css
          grep -Fq '.qm-context-media img' public/assets/qatar-market-polish-v2.css
          grep -Fq 'prefers-reduced-motion' public/assets/qatar-market-polish-v2.css
          grep -Fq 'suppliers.html' src/pages/qatar-market.astro
          grep -Fq 'capabilities.html' src/pages/qatar-market.astro
          grep -Fq 'contact.html' src/pages/qatar-market.astro
      - name: Build Astro site
        run: |
          npm install
          npm run build
