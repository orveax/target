name: TARGET Premium Header V2 QA
on:
  push:
    branches: [main]
    paths:
      - 'src/components/SiteHeader.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'public/assets/header-premium-v2.css'
      - 'public/assets/header-premium-v2-guard.css'
      - 'public/assets/header-premium-v2.js'
      - '.github/workflows/header-premium-v2-qa.yml'
  pull_request:
    paths:
      - 'src/components/SiteHeader.astro'
      - 'src/layouts/BaseLayout.astro'
      - 'public/assets/header-premium-v2.css'
      - 'public/assets/header-premium-v2-guard.css'
      - 'public/assets/header-premium-v2.js'

jobs:
  header-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify premium Header V2 contract
        run: |
          set -euo pipefail
          test -f dist/assets/header-premium-v2.css
          test -f dist/assets/header-premium-v2-guard.css
          test -f dist/assets/header-premium-v2.js
          grep -q 'header-premium-v2.css?v=20260817-01' dist/index.html
          grep -q 'header-premium-v2-guard.css?v=20260817-01' dist/index.html
          grep -q 'header-premium-v2.js?v=20260817-01' dist/index.html
          grep -q 'target-header-v2' dist/index.html
          grep -q 'th2-nav-rail' dist/index.html
          grep -q 'th2-mega-toggle' dist/index.html
          grep -q 'th2-mega-panel' dist/index.html
          grep -q 'th2-mega-feature' dist/index.html
          grep -q 'qatar-market.html' dist/index.html
          grep -q 'company-profile.html' dist/index.html
          grep -q 'partners@targetft.com' dist/index.html
          grep -q 'th2-mobile-commercial' dist/index.html
          grep -q 'th2-mobile-primary' dist/index.html
          grep -q -- '--th2-charcoal:#262626' dist/assets/header-premium-v2.css
          grep -q 'background:rgba(255,253,249,.99)' dist/assets/header-premium-v2.css
          grep -q 'background:linear-gradient(145deg,#2A2A2A,#1F1F1F)' dist/assets/header-premium-v2.css
          grep -q 'aria-expanded' dist/index.html
          grep -q "event.key !== 'Escape'" dist/assets/header-premium-v2.js
          grep -q '@media (min-width:1200px)' dist/assets/header-premium-v2-guard.css
          ! grep -q 'nav-contact-utility' dist/index.html
          echo 'TARGET PREMIUM HEADER V2: PASS'
