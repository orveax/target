name: TARGET For Suppliers Polish V3 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/suppliers-polish-v3.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/suppliers.astro'
      - '.github/workflows/suppliers-polish-v3-qa.yml'
  workflow_dispatch:

jobs:
  suppliers-polish-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify screenshot-driven supplier layout corrections
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/suppliers-polish-v3.css
          grep -Fq 'suppliers-polish-v3.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq '4820847' public/assets/suppliers-polish-v3.css
          grep -Fq '7362950' public/assets/suppliers-polish-v3.css
          grep -Fq 'max-height:500px' public/assets/suppliers-polish-v3.css
          grep -Fq 'grid-template-columns:30px 44px minmax(0,1fr)' public/assets/suppliers-polish-v3.css
          grep -Fq 'grid-template-columns:minmax(0,1.78fr) minmax(280px,.62fr)' public/assets/suppliers-polish-v3.css
          grep -Fq '.fs-clarity-list article' public/assets/suppliers-polish-v3.css
          grep -Fq 'prefers-reduced-motion' public/assets/suppliers-polish-v3.css
          grep -Fq 'id="product-review"' src/pages/suppliers.astro
          grep -Fq 'privacy.html' src/pages/suppliers.astro
          grep -Fq 'qatar-market.html' src/pages/suppliers.astro
      - name: Build Astro site
        run: |
          npm install
          npm run build
