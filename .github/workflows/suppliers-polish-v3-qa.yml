name: TARGET For Suppliers Premium V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/hero-suppliers-premium-v1.css'
      - 'public/assets/suppliers-polish-v3.css'
      - 'public/assets/form-delivery-v1.js'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/suppliers.astro'
      - '.github/workflows/suppliers-polish-v3-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  suppliers-premium-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET For Suppliers Premium V2 QA' --arg description 'Supplier conversion QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical supplier contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'hero-suppliers-premium-v1.css?v=20260818-01' src/layouts/BaseLayout.astro
          grep -Fq 'grid-template-columns:minmax(0,55fr) minmax(360px,45fr)' public/assets/hero-suppliers-premium-v1.css
          grep -Fq 'background:#F4EDE4!important' public/assets/hero-suppliers-premium-v1.css
          grep -Fq 'id="product-review"' src/pages/suppliers.astro
          grep -Fq 'name="name"' src/pages/suppliers.astro
          grep -Fq 'name="company"' src/pages/suppliers.astro
          grep -Fq 'name="country"' src/pages/suppliers.astro
          grep -Fq 'name="email"' src/pages/suppliers.astro
          grep -Fq 'name="phone"' src/pages/suppliers.astro
          grep -Fq 'name="product"' src/pages/suppliers.astro
          grep -Fq 'name="opportunity"' src/pages/suppliers.astro
          grep -Fq 'name="summary"' src/pages/suppliers.astro
          grep -Fq 'minlength="30" maxlength="700"' src/pages/suppliers.astro
          grep -Fq 'privacy.html' src/pages/suppliers.astro
          grep -Fq "return 'partners@targetft.com'" public/assets/form-delivery-v1.js
          grep -Fq "form.dataset.deliveryMode = 'email-client'" public/assets/form-delivery-v1.js
          grep -Fq 'suppliers-polish-v3.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq 'prefers-reduced-motion' public/assets/suppliers-polish-v3.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Install Playwright package and use hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 > /tmp/target-suppliers-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/suppliers.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/target-suppliers-http.log
          exit 1
      - name: Capture and validate AR/EN supplier conversion contract
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p suppliers-premium-v2
          cat > suppliers-premium-v2/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/suppliers.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000},screen:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024},screen:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},screen:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const context=await browser.newContext(opts);
            try{
              const page=await context.newPage();
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              for(const lang of ['ar','en']){
                const current=await page.locator('html').getAttribute('lang');
                if(current!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(250);}
                await page.evaluate(async()=>{
                  const pause=(ms)=>new Promise(r=>setTimeout(r,ms));
                  const step=Math.max(420,Math.floor(innerHeight*.7));
                  for(let y=0;y<document.documentElement.scrollHeight;y+=step){scrollTo(0,y);await pause(80)}
                  scrollTo(0,0);await pause(250);
                });
                const m=await page.evaluate(()=>{
                  const grid=document.querySelector('.fs-hero-grid');
                  const copy=document.querySelector('.fs-hero-copy');
                  const media=document.querySelector('.fs-hero-media');
                  const form=document.querySelector('#product-review form[data-target-form]');
                  const imgs=[...document.querySelectorAll('.fs-hero-media img,.fs-prepare-media img')];
                  const gc=getComputedStyle(grid);
                  const cr=copy.getBoundingClientRect(), mr=media.getBoundingClientRect();
                  return {
                    lang:document.documentElement.lang,
                    width:innerWidth,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1Count:document.querySelectorAll('.page-suppliers h1').length,
                    audience:document.querySelectorAll('.fs-audience-grid article').length,
                    prepare:document.querySelectorAll('.fs-checklist article').length,
                    after:document.querySelectorAll('.fs-after-steps article').length,
                    clarity:document.querySelectorAll('.fs-clarity-list article').length,
                    fields:form.querySelectorAll('input:not([type="checkbox"]),select,textarea').length,
                    required:form.querySelectorAll('[required]').length,
                    deliveryMode:form.dataset.deliveryMode,
                    deliveryNote:form.querySelectorAll('[data-form-delivery-note]').length,
                    gridCols:gc.gridTemplateColumns,
                    copyTop:cr.top, mediaTop:mr.top, copyWidth:cr.width, mediaWidth:mr.width,
                    heroBg:getComputedStyle(document.querySelector('.fs-hero')).backgroundColor,
                    pendingImages:imgs.filter(img=>!img.complete||img.naturalWidth<20).length
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1Count!==1) failures.push(`${name}-${lang}: expected one H1`);
                if(m.audience!==4) failures.push(`${name}-${lang}: expected 4 audience cues`);
                if(m.prepare!==4) failures.push(`${name}-${lang}: expected 4 preparation rows`);
                if(m.after!==3) failures.push(`${name}-${lang}: expected 3 after-submission steps`);
                if(m.clarity!==4) failures.push(`${name}-${lang}: expected 4 clarity items`);
                if(m.fields!==8) failures.push(`${name}-${lang}: expected 8 primary form fields, found ${m.fields}`);
                if(m.required!==8) failures.push(`${name}-${lang}: expected 8 required controls including privacy, found ${m.required}`);
                if(m.deliveryMode!=='email-client'||m.deliveryNote!==1) failures.push(`${name}-${lang}: transparent email-client delivery state missing`);
                if(m.pendingImages>0) failures.push(`${name}-${lang}: ${m.pendingImages} required images failed to load`);
                if(name==='1440' && m.gridCols.trim().split(/\s+/).length<2) failures.push(`${name}-${lang}: canonical 55/45 desktop split not active`);
                if(name!=='1440' && !(m.copyTop < m.mediaTop)) failures.push(`${name}-${lang}: mobile/tablet must show text/actions before media`);
                await page.screenshot({path:`suppliers-premium-v2/${name}-${lang}.png`,fullPage:true});
              }
              // Validation UX: empty submit must focus the first required field and show summary.
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.locator('#product-review').scrollIntoViewIfNeeded();
              await page.locator('.fs-submit').click();
              await page.waitForTimeout(150);
              const validation=await page.evaluate(()=>({
                activeId:document.activeElement?.id||'',
                summaryVisible:document.querySelector('[data-validation-summary]')?.classList.contains('is-visible')||false,
                nameInvalid:document.querySelector('#supplier-name')?.getAttribute('aria-invalid')
              }));
              if(validation.activeId!=='supplier-name') failures.push(`${name}: validation did not focus supplier-name`);
              if(!validation.summaryVisible) failures.push(`${name}: validation summary not visible`);
              if(validation.nameInvalid!=='true') failures.push(`${name}: first invalid field not marked aria-invalid`);
            }catch(e){failures.push(`${name}: ${e.message}`)} finally{await context.close()}
          }
          fs.writeFileSync('suppliers-premium-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('suppliers-premium-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node suppliers-premium-v2/capture.mjs
      - name: Upload supplier visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-suppliers-premium-v2
          path: suppliers-premium-v2
          if-no-files-found: warn
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == "success" ]]; then STATE=success; DESC='For Suppliers Premium V2 QA passed'; else STATE=failure; DESC='For Suppliers Premium V2 QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET For Suppliers Premium V2 QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' > /tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
