name: TARGET Home Real Photography V2 QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  home-real-photography-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify homepage photography, media layout and site icon
        run: |
          test -f public/assets/home-real-photography-v2.css
          test -f public/assets/brand/target-site-icon-v1.svg
          grep -q 'home-real-photography-v2.css?v=20260816-03' src/layouts/BaseLayout.astro
          grep -q 'target-site-icon-v1.svg' src/layouts/BaseLayout.astro
          grep -q 'theme-color' src/layouts/BaseLayout.astro
          grep -q '36823725' public/assets/home-real-photography-v2.css
          grep -q '7451955' public/assets/home-real-photography-v2.css
          grep -q '4481326' public/assets/home-real-photography-v2.css
          grep -q '5953751' public/assets/home-real-photography-v2.css
          grep -q '.hc-work-grid::before' public/assets/home-real-photography-v2.css
          grep -q '.hc-why-layout::before' public/assets/home-real-photography-v2.css
          grep -q 'grid-template-areas' public/assets/home-real-photography-v2.css
          grep -q '#0C4931' public/assets/brand/target-site-icon-v1.svg
          grep -q '#C09552' public/assets/brand/target-site-icon-v1.svg
