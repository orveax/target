name: TARGET 404 Recovery V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/404.astro'
      - 'src/components/SiteFooter.astro'
      - 'public/assets/404-recovery-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - '.github/workflows/404-polish-v1-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  recovery-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish QA pending status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n --arg state pending --arg context 'TARGET 404 Recovery V2 QA' --arg description '404 Recovery V2 QA is running' --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify final recovery contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/404-recovery-v2.css
          test ! -f public/assets/404-polish-v1.css
          grep -Fq '404-recovery-v2.css?v=20260818-02' src/layouts/BaseLayout.astro
          ! grep -Fq '404-polish-v1.css' src/layouts/BaseLayout.astro
          grep -Fq 'footerVariant=' src/layouts/BaseLayout.astro
          grep -Fq '<SiteFooter variant={footerVariant} />' src/layouts/BaseLayout.astro
          grep -Fq 'footerVariant="compact"' src/pages/404.astro
          grep -Fq "variant = 'default'" src/components/SiteFooter.astro
          grep -Fq 'target-footer-v6--compact' src/components/SiteFooter.astro
          grep -Fq 'tf6-compact-nav' src/components/SiteFooter.astro
          grep -Fq 'robots="noindex,follow"' src/pages/404.astro
          grep -Fq 'href="index.html"' src/pages/404.astro
          grep -Fq 'href="products-companies.html"' src/pages/404.astro
          grep -Fq 'href="contact.html"' src/pages/404.astro
          grep -Fq 'href="faq.html"' src/pages/404.astro
          grep -Fq 'هذه الصفحة لا تعني وجود مشكلة في الموقع أو في إرسال أي نموذج' src/pages/404.astro
          ! grep -Fq 'مشكلة في حسابك' src/pages/404.astro
          ! grep -Fq 'food-portfolio.html' src/pages/404.astro
          ! grep -Fq 'legacy/404.html' src/pages/404.astro
          grep -Fq 'Compact utility footer' public/assets/404-recovery-v2.css
          grep -Fq '@media(max-width:991.98px)' public/assets/404-recovery-v2.css
          grep -Fq 'prefers-reduced-motion:reduce' public/assets/404-recovery-v2.css
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Verify default footer remains full on public routes
        shell: bash
        run: |
          grep -Fq 'tf6-navigation' dist/index.html
          ! grep -Fq 'target-footer-v6--compact' dist/index.html
          grep -Fq 'target-footer-v6--compact' dist/404.html
          grep -Fq 'tf6-compact-nav' dist/404.html
          ! grep -Fq 'tf6-contact-band' dist/404.html
      - name: Prepare hosted Chrome
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start static server
        run: |
          npx --yes http-server dist -p 4173 -c-1 >/tmp/404-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/404.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/404-http.log; exit 1
      - name: Browser and responsive recovery QA
        env:
          CHROME_PATH: ${{ env.CHROME_PATH }}
        run: |
          mkdir -p recovery-v2
          cat > recovery-v2/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_PATH});
          const origin='http://127.0.0.1:4173/404.html';
          const viewports=[
            ['1440',{viewport:{width:1440,height:1000}}],
            ['768',{viewport:{width:768,height:1024}}],
            ['390',{viewport:{width:390,height:844},isMobile:true,hasTouch:true}]
          ];
          const failures=[]; const metrics=[];
          for(const [name,opts] of viewports){
            const ctx=await browser.newContext(opts);
            const page=await ctx.newPage();
            try{
              await page.goto(origin,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts) await document.fonts.ready;});
              await page.waitForTimeout(250);
              for(const lang of ['ar','en']){
                if(await page.locator('html').getAttribute('lang')!==lang){await page.locator('[data-lang-toggle]').first().click();await page.waitForTimeout(220);}
                const m=await page.evaluate(()=>{
                  const copy=document.querySelector('.not-found-copy').getBoundingClientRect();
                  const recovery=document.querySelector('.not-found-recovery').getBoundingClientRect();
                  const footer=document.querySelector('.target-footer-v6--compact')?.getBoundingClientRect();
                  const robots=document.querySelector('meta[name="robots"]')?.getAttribute('content');
                  const hrefs=[...document.querySelectorAll('.recovery-route a')].map(a=>a.getAttribute('href'));
                  const actions=[...document.querySelectorAll('.not-found-actions a')].map(a=>a.getAttribute('href'));
                  const compactHrefs=[...document.querySelectorAll('.tf6-compact-nav a')].map(a=>a.getAttribute('href'));
                  return {
                    lang:document.documentElement.lang,
                    dir:document.documentElement.dir,
                    overflowX:document.documentElement.scrollWidth>document.documentElement.clientWidth,
                    h1:document.querySelectorAll('.page-404 h1').length,
                    code:document.querySelector('.not-found-code')?.textContent.replace(/\s/g,''),
                    robots,
                    recoveryRoutes:document.querySelectorAll('.recovery-route a').length,
                    faqLinks:document.querySelectorAll('.recovery-help[href="faq.html"]').length,
                    productLinks:document.querySelectorAll('a[href="products-companies.html"]').length,
                    legacyProductLinks:document.querySelectorAll('a[href="food-portfolio.html"]').length,
                    globalNav:document.querySelectorAll('.target-section-nav').length,
                    compactFooter:document.querySelectorAll('.target-footer-v6--compact').length,
                    compactLinks:document.querySelectorAll('.tf6-compact-nav a').length,
                    fullFooterNav:document.querySelectorAll('.tf6-navigation').length,
                    contactBand:document.querySelectorAll('.tf6-contact-band').length,
                    note:document.querySelector('.recovery-note')?.textContent.trim(),
                    hrefs,actions,compactHrefs,
                    copyTop:copy.top,recoveryTop:recovery.top,copyWidth:copy.width,recoveryWidth:recovery.width,
                    footerHeight:footer?.height||0,
                    actionWidths:[...document.querySelectorAll('.not-found-actions a')].map(a=>a.getBoundingClientRect().width)
                  };
                });
                metrics.push({viewport:name,...m});
                if(m.overflowX) failures.push(`${name}-${lang}: horizontal overflow`);
                if(m.h1!==1||m.code!=='404') failures.push(`${name}-${lang}: 404 identity mismatch`);
                if(m.robots!=='noindex,follow') failures.push(`${name}-${lang}: robots must be noindex,follow`);
                if(m.recoveryRoutes!==3||m.faqLinks!==1||m.productLinks<2||m.legacyProductLinks!==0) failures.push(`${name}-${lang}: recovery route contract mismatch`);
                if(!m.hrefs.includes('index.html')||!m.hrefs.includes('products-companies.html')||!m.hrefs.includes('contact.html')) failures.push(`${name}-${lang}: primary recovery routes mismatch`);
                if(m.actions.length!==2||m.actions[0]!=='index.html'||m.actions[1]!=='contact.html') failures.push(`${name}-${lang}: primary action hierarchy mismatch`);
                if(m.globalNav!==0) failures.push(`${name}-${lang}: utility page must not show section navigation`);
                if(m.compactFooter!==1||m.compactLinks!==5||m.fullFooterNav!==0||m.contactBand!==0) failures.push(`${name}-${lang}: compact footer contract mismatch`);
                for(const href of ['index.html','contact.html','faq.html','privacy.html','terms.html']) if(!m.compactHrefs.includes(href)) failures.push(`${name}-${lang}: compact footer missing ${href}`);
                if(lang==='ar'&&m.note.includes('حسابك')) failures.push(`${name}-${lang}: stale account wording remains`);
                if(name==='1440'){
                  if(Math.abs(m.copyTop-m.recoveryTop)>160) failures.push(`${name}-${lang}: desktop recovery panel alignment drift`);
                  if(m.copyWidth<=m.recoveryWidth) failures.push(`${name}-${lang}: recovery panel must remain secondary to message`);
                  if(m.footerHeight>220) failures.push(`${name}-${lang}: compact footer is too tall (${m.footerHeight}px)`);
                }else if(!(m.copyTop<m.recoveryTop)) failures.push(`${name}-${lang}: recovery panel must follow message on tablet/mobile`);
                if(name==='390'){
                  if(m.actionWidths.some(w=>w<300)) failures.push(`${name}-${lang}: mobile primary actions are not full-width`);
                  if(m.footerHeight>320) failures.push(`${name}-${lang}: mobile compact footer is too tall (${m.footerHeight}px)`);
                }
                await page.screenshot({path:`recovery-v2/${name}-${lang}-first-fold.png`,fullPage:false});
                await page.screenshot({path:`recovery-v2/${name}-${lang}-full.png`,fullPage:true});
              }
            }catch(e){failures.push(`${name}: ${e.message}`)}finally{await ctx.close()}
          }
          fs.writeFileSync('recovery-v2/metrics.json',JSON.stringify(metrics,null,2));
          fs.writeFileSync('recovery-v2/failures.txt',failures.join('\n'));
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node recovery-v2/capture.mjs
      - name: Upload recovery visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-404-recovery-v2
          path: recovery-v2
          retention-days: 14
      - name: Publish final QA status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "$JOB_STATUS" == success ]]; then STATE=success; DESC='404 Recovery V2 QA passed'; else STATE=failure; DESC='404 Recovery V2 QA failed'; fi
          jq -n --arg state "$STATE" --arg context 'TARGET 404 Recovery V2 QA' --arg description "$DESC" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}' >/tmp/status.json
          curl -fsSL -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d @/tmp/status.json >/dev/null
