name: TARGET Premium Hero System V1 — Home Gate
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  home-trade-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify strategy and Home H01-H13 contract
        run: |
          set -euo pipefail
          DOC='docs/TARGET-PREMIUM-HERO-SYSTEM-V1.md'
          HERO='public/assets/premium-hero-system-v1.css'
          SHIM='public/assets/hero-home-premium-v2.css'
          MEDIA='public/content/hero-media-manifest-v1.json'
          HOME='src/components/HomePremium.astro'
          LAYOUT='src/layouts/BaseLayout.astro'

          test -f "$DOC"
          test -f "$HERO"
          test -f "$SHIM"
          test -f "$MEDIA"

          # H01 Canonical accuracy.
          grep -q 'data-ar="من المصنع إلى السوق القطري."' "$HOME"
          grep -q 'href="suppliers.html"' "$HOME"
          grep -q 'href="capabilities.html"' "$HOME"
          grep -q 'class="hc-route"' "$HOME"

          # H02/H03 page identity + distinct Trade Gateway archetype.
          grep -q 'PAGE 01 — HOME / TRADE GATEWAY' "$HERO"
          grep -q 'controlled ~52/48 split' "$DOC"
          grep -q 'grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)!important' "$HERO"
          grep -q 'background-size:42px 42px!important' "$HERO"

          # H04 TARGET DNA.
          grep -q -- '--ph-forest:#0C4931' "$HERO"
          grep -q -- '--ph-cream:#F4EDE4' "$HERO"
          grep -q -- '--ph-charcoal:#262626' "$HERO"
          grep -q -- '--ph-sand:#C09552' "$HERO"
          grep -q 'min-height:52px!important' "$HERO"

          # H05/H06 media relevance + rights/source record.
          grep -q 'pexels-photo-36823725' "$HERO"
          grep -q '"sourceProvider": "Pexels"' "$MEDIA"
          grep -q '"sourceId": "36823725"' "$MEDIA"
          grep -q 'industrial food production facility' "$MEDIA"
          grep -q 'rightsNote' "$MEDIA"

          # H07 geometry / spacing envelope.
          grep -q 'min-height:clamp(680px,71vh,760px)!important' "$HERO"
          grep -q 'padding-block:clamp(84px,7vw,108px)!important' "$HERO"
          grep -q 'gap:clamp(44px,5vw,68px)!important' "$HERO"
          grep -q 'aspect-ratio:5/4!important' "$HERO"

          # H08 typography.
          grep -q 'font-size:clamp(3rem,5.5vw,5rem)!important' "$HERO"
          grep -q 'var(--target-font-ar' "$HERO"
          grep -q 'var(--target-font-en' "$HERO"

          # H09 responsive matrix.
          grep -q '@media (min-width:1024px) and (max-width:1279.98px)' "$HERO"
          grep -q '@media (min-width:768px) and (max-width:1023.98px)' "$HERO"
          grep -q '@media (max-width:767.98px)' "$HERO"

          # H10 handheld Desktop Site.
          grep -q 'html.handheld-desktop-mode .page-home' "$HERO"

          # H11 RTL/LTR.
          grep -q 'html\[dir="ltr"\] .page-home' "$HERO"
          grep -q 'html\[lang="en"\] .page-home' "$HERO"

          # H12 accessibility/reduced motion contract.
          grep -q 'focus-visible' "$HERO"
          grep -q '@media (prefers-reduced-motion:reduce)' "$HERO"

          # H13 architecture/performance: one authoritative file loaded last; old Home file is passive.
          grep -q 'premium-hero-system-v1.css?v=20260817-01' "$LAYOUT"
          ! grep -q '@import' "$SHIM"
          grep -q 'aspect-ratio:5/4!important' "$HERO"

          echo 'H01-H13 SOURCE CONTRACT: PASS'
      - name: H14 site-wide regression audit
        run: node scripts/final-audit.mjs
      - name: H15 visual-review boundary
        run: echo 'H15 requires rendered visual review; CI/source PASS is not final visual approval.'
