name: TARGET Premium Hero System V1 — Site Gate
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hero-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
      - name: Verify Hero strategy, archetypes and media governance
        run: |
          set -euo pipefail
          DOC='docs/TARGET-PREMIUM-HERO-SYSTEM-V1.md'
          MANIFEST='public/content/hero-media-manifest-v1.json'
          ROOT='public/assets/premium-hero-system-v1.css'
          test -f "$DOC" && test -f "$MANIFEST" && test -f "$ROOT"

          # Strategy + shared DNA
          grep -qi 'at least 4 of these 6 dimensions' "$DOC"
          grep -q 'H01 Canonical Accuracy' "$DOC"
          grep -q 'H15 Real Visual Review' "$DOC"
          grep -q '#0C4931' "$DOC"
          grep -q '#F4EDE4' "$DOC"
          grep -q 'Tajawal' "$DOC"
          grep -q 'Manrope' "$DOC"
          grep -q '1440/1280/1024/768/430/390/360' "$DOC"

          # H01 canonical Hero copy / core actions
          grep -q 'data-ar="من المصنع إلى السوق القطري."' src/components/HomePremium.astro
          grep -q 'data-ar="شركة قطرية لتجارة واستيراد الأغذية تربط المنتجات المناسبة بفرص السوق القطري."' src/components/AboutCanonical.astro
          grep -q 'data-ar="نأخذ المنتج في خطوات واضحة من الفرصة إلى السوق القطري."' src/components/HowWeWorkCanonical.astro
          grep -q 'data-ar="منتجات غذائية مختارة وفرص نراجعها للسوق القطري."' src/pages/food-portfolio.astro
          grep -q 'data-ar="فرصة المنتج في قطر تبدأ بفهم السوق قبل التحرك."' src/pages/qatar-market.astro
          grep -q 'data-ar="هل لديك منتج غذائي وتريد مناقشة فرصته في قطر؟"' src/pages/suppliers.astro
          grep -q 'data-ar="اختر القناة المناسبة، وساعدنا على فهم طلبك من البداية."' src/pages/contact.astro
          grep -q 'data-ar="تعرف على تارقت ونشاطها التجاري في الأغذية داخل قطر."' src/pages/company-profile.astro
          grep -q 'data-ar="إجابات واضحة قبل أن تبدأ."' src/pages/faq.astro
          grep -q 'data-ar="سياسة الخصوصية"' src/pages/privacy.astro
          grep -q 'data-ar="الشروط والأحكام"' src/pages/terms.astro

          # H02/H03: 11 distinct archetypes implemented.
          grep -q 'TRADE GATEWAY' "$ROOT"
          grep -q 'Archetype: Institutional Editorial' public/assets/hero-about-premium-v1.css
          grep -q 'Archetype: Operational Canvas' public/assets/hero-how-we-work-premium-v1.css
          grep -q 'Archetype: Curated Product Mosaic' public/assets/hero-products-premium-v1.css
          grep -q 'Archetype: Market Lens' public/assets/hero-qatar-market-premium-v1.css
          grep -q 'Archetype: Supplier Conversion Stage' public/assets/hero-suppliers-premium-v1.css
          grep -q 'Archetype: Contact Routing Hub' public/assets/hero-contact-premium-v1.css
          grep -q 'Archetype: Document Stage' public/assets/hero-company-profile-premium-v1.css
          grep -q 'Archetype: Knowledge Index' public/assets/hero-faq-premium-v1.css
          grep -q 'Archetype: Trust & Data Document' public/assets/hero-privacy-premium-v1.css
          grep -q 'Archetype: Legal Reading Prelude' public/assets/hero-terms-premium-v1.css

          # H04/H07/H08 shared implementation bounds.
          grep -q -- '--ph-forest:#0C4931' "$ROOT"
          grep -q -- '--ph-cream:#F4EDE4' "$ROOT"
          grep -q -- '--ph-charcoal:#262626' "$ROOT"
          grep -q -- '--ph-sand:#C09552' "$ROOT"
          grep -q 'clamp(3rem,5.5vw,5rem)' "$ROOT"
          grep -q 'clamp(2.6rem, 4.5vw, 4.1rem)' "$DOC"
          grep -q '1200px' "$DOC"
          grep -q 'Minimum interactive target: 48px' "$DOC"

          # H05/H06: all 11 pages have resolved media states and governance records.
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('public/content/hero-media-manifest-v1.json','utf8'));
          const expected=['home','about','howWeWork','products','qatarMarket','suppliers','contact','companyProfile','faq','privacy','terms'];
          if(!m.policy.realPhotographyOnlyWherePhotographyIsUsed || m.policy.aiHeroPhotographyAllowed) throw new Error('media policy drift');
          for(const key of expected){
            const p=m.pages[key];
            if(!p) throw new Error(`missing manifest page ${key}`);
            if(String(p.status).includes('pending-migration')) throw new Error(`unresolved migration state ${key}`);
            if(!p.rightsNote) throw new Error(`missing rights note ${key}`);
          }
          for(const key of ['home','about','howWeWork','qatarMarket','suppliers','contact']){
            const p=m.pages[key];
            if(p.sourceProvider!=='Pexels') throw new Error(`${key} photo provider not recorded`);
            if(!p.sourceId || !p.sourceUrl) throw new Error(`${key} photo source incomplete`);
          }
          if(!Array.isArray(m.pages.products.sources) || m.pages.products.sources.length<3) throw new Error('Products mosaic needs >=3 recorded real sources');
          if(m.pages.companyProfile.status!=='active-pdf-pending') throw new Error('Company Profile must stay explicit PDF-pending');
          NODE

          # H09/H10/H11/H12: responsive, handheld desktop, RTL/LTR, reduced motion on every page Hero layer.
          for f in \
            public/assets/hero-about-premium-v1.css \
            public/assets/hero-how-we-work-premium-v1.css \
            public/assets/hero-products-premium-v1.css \
            public/assets/hero-qatar-market-premium-v1.css \
            public/assets/hero-suppliers-premium-v1.css \
            public/assets/hero-contact-premium-v1.css \
            public/assets/hero-company-profile-premium-v1.css \
            public/assets/hero-faq-premium-v1.css \
            public/assets/hero-privacy-premium-v1.css \
            public/assets/hero-terms-premium-v1.css; do
              grep -q '@media' "$f"
              grep -q 'handheld-desktop-mode' "$f"
              grep -q 'dir="ltr"\|lang="en"' "$f"
              grep -q 'prefers-reduced-motion' "$f"
          done
          grep -q 'handheld-desktop-mode .page-home' "$ROOT"
          grep -q 'dir="ltr".*page-home\|lang="en".*page-home' "$ROOT"
          grep -q 'prefers-reduced-motion' "$ROOT"

          # Distinct geometry smoke assertions.
          grep -q 'grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)' "$ROOT"                    # Home split
          grep -q 'grid-template-columns:minmax(0,1.42fr) minmax(300px,.78fr)' public/assets/hero-about-premium-v1.css
          grep -q 'background:#242725' public/assets/hero-how-we-work-premium-v1.css
          grep -q 'Three-tile real product/category mosaic' public/assets/hero-products-premium-v1.css
          grep -q 'grid-template-columns:1fr!important' public/assets/hero-qatar-market-premium-v1.css
          grep -q 'margin-inline-end:-46px' public/assets/hero-suppliers-premium-v1.css
          grep -q 'min-height:clamp(500px,56vh,590px)' public/assets/hero-contact-premium-v1.css
          grep -q 'active-pdf-pending' "$MANIFEST"
          grep -q 'KNOWLEDGE INDEX' public/assets/hero-faq-premium-v1.css
          grep -q 'Flat information graphic' public/assets/hero-privacy-premium-v1.css
          grep -q '01   02   03   04   05' public/assets/hero-terms-premium-v1.css

          echo 'TARGET PREMIUM HERO SYSTEM V1 H01-H13: PASS'
      - name: H14 site-wide regression audit
        run: node scripts/final-audit.mjs
      - name: H15 boundary
        run: |
          test -f .github/workflows/hero-visual-snapshot-v1.yml
          grep -q '11-page Hero matrix' .github/workflows/hero-visual-snapshot-v1.yml
          echo 'H15 requires rendered artifact/user visual review; source CI does not auto-approve visual quality.'
