name: TARGET For Suppliers Polish V2 QA

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/suppliers-polish-v2.css'
      - 'src/layouts/BaseLayout.astro'
      - 'src/pages/suppliers.astro'
      - '.github/workflows/suppliers-polish-v2-qa.yml'
  workflow_dispatch:

jobs:
  suppliers-polish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify supplier conversion visual contract
        shell: bash
        run: |
          set -euo pipefail
          test -f public/assets/suppliers-polish-v2.css
          grep -Fq 'suppliers-polish-v2.css?v=20260817-01' src/layouts/BaseLayout.astro
          grep -Fq '11679687' public/assets/suppliers-polish-v2.css
          grep -Fq '5953728' public/assets/suppliers-polish-v2.css
          grep -Fq '.fs-form-layout' public/assets/suppliers-polish-v2.css
          grep -Fq '.fs-after' public/assets/suppliers-polish-v2.css
          grep -Fq 'position:sticky' public/assets/suppliers-polish-v2.css
          grep -Fq 'prefers-reduced-motion' public/assets/suppliers-polish-v2.css
          grep -Fq 'id="product-review"' src/pages/suppliers.astro
          grep -Fq 'privacy.html' src/pages/suppliers.astro
          grep -Fq 'qatar-market.html' src/pages/suppliers.astro
          grep -Fq 'contact.html' src/pages/suppliers.astro
          grep -Fq 'maxlength="700"' src/pages/suppliers.astro
      - name: Build Astro site
        run: |
          npm install
          npm run build
