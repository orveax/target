name: TARGET About Real Photography V2 QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  about-real-photography-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify About direct photography layer
        run: |
          test -f public/assets/about-real-photography-v2.css
          grep -q 'about-real-photography-v2.css?v=20260816-01' src/layouts/BaseLayout.astro
          grep -q '4481260' public/assets/about-real-photography-v2.css
          grep -q '31583097' public/assets/about-real-photography-v2.css
          grep -q '.page-about .about-canonical .about-hero__media' public/assets/about-real-photography-v2.css
          grep -q '.page-about .about-canonical .about-who__media' public/assets/about-real-photography-v2.css
          grep -q 'page-scoped direct photography layer' public/assets/about-real-photography-v2.css
          grep -q 'bodyClass="page-about about-canonical-page"' src/pages/about.astro
